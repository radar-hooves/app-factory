name: Change pipeline

# The pipeline's own tests. change.yaml and .github/actions/change/ are the one copy every
# household repo calls (radar-hooves/app-factory/.github/workflows/change.yaml@main); a push to
# them reaches every caller, so the planner's suite gates it here. A fork's pull request runs on
# a GitHub-hosted runner, never a household one.
on:
  push:
    branches: [main]
    paths: ['.github/actions/change/**', '.github/actions/setup-uv/**', '.github/workflows/change.yaml', '.github/workflows/change-pipeline.yaml']
  pull_request:
    paths: ['.github/actions/change/**', '.github/actions/setup-uv/**', '.github/workflows/change.yaml', '.github/workflows/change-pipeline.yaml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan-test:
    name: Planner suite
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted", "household", "linux"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: '0.9.30'
      - run: uvx pytest -q .github/actions/change/plan_test.py
