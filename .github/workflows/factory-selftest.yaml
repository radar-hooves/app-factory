name: Factory self-test

# The factory's own answer to master-project#839 NEED 1: "the factory's code is
# tested in the factory." Renders a throwaway app from THIS commit with
# `factory_selftest=true` — the one caller allowed to set it (copier.yaml) — so
# the scratch render carries the ~20 test_*.py/*.test.ts files that assert
# behaviour of a factory-owned module (auth, rate limiting, the admin/agent/
# feedback APIs, vend, the mcp mount…) and that an ordinary stamp no longer
# receives at all. Runs their own suite there, on a rendered app, exactly as a
# real app would run it — never against template/ source directly, which is
# Jinja, not Python or TypeScript.
#
# The kits a stamp imports are tested here too, beside it: each Python kit's
# own lint, types and suite first, then the render resolves every Python kit
# and @poodle64/ui and @poodle64/librarian from THIS checkout rather than the index or npm, so a change
# to kit and stamp is proven together before either is released.
#
# Never on the stamped caller (change.yaml under template/.github/workflows):
# that is what copier stamps INTO an app, and inlining
# this job there would ship the factory's own self-test into every app's CI,
# exactly the drift this closes. This workflow lives at THIS repo's own root,
# beside kit-rust.yaml and security.yaml, which is this repo's first-party CI.
#
# Household CI's self-hosted default applies (rules-library/fleet/ci.md), and
# for a stronger reason than kit-rust.yaml's fork exception: a rendered app's
# BACKEND resolves real dependencies off the household's PRIVATE package index
# (redactyl-core, api-common, the nextcloud client), reachable only from atlas
# by its LAN address, never through a repository secret a fork PR could read
# (the frontend's @poodle64/* is public on npmjs and carries no such
# constraint on its own, per frontend-ci.yaml's reusable — the backend half is
# what forces this job onto the trusted runner only). There is no safe
# hosted-runner path for this job the way there is for kit-rust's pure Rust/Nix
# build, so a fork PR skips it outright rather than running it credential-less
# and red.

# The factory releases by direct push, so a push to main runs the same paths a pull
# request does, so a defect in template/ is caught at the push, not by the app
# that adopts it. The concurrency group below cancels a burst down to one run.
on:
  pull_request:
    paths:
      - 'template/**'
      - 'copier.yaml'
      - 'variants.yaml'
      - 'slices.yaml'
      - 'tests/template/**'
      - 'skeletons/desktop/**'
      - 'skeletons/android/**'
      - 'tests/desktop/**'
      - 'tests/migrations/**'
      - 'tests/arbitrary-values/**'
      - 'tests/layout-ownership/**'
      - 'tests/listener/**'
      - 'kits/typescript/packages/design-tokens/bin/**'
      - 'tests/elements/**'
      - 'kits/python/**'
      - 'kits/typescript/packages/ui/**'
      - 'kits/typescript/packages/librarian/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/factory-selftest.yaml'
  push:
    branches: [main]
    paths:
      - 'template/**'
      - 'copier.yaml'
      - 'variants.yaml'
      - 'slices.yaml'
      - 'tests/template/**'
      - 'skeletons/desktop/**'
      - 'skeletons/android/**'
      - 'tests/desktop/**'
      - 'tests/migrations/**'
      - 'tests/arbitrary-values/**'
      - 'tests/layout-ownership/**'
      - 'tests/listener/**'
      - 'kits/typescript/packages/design-tokens/bin/**'
      - 'tests/elements/**'
      - 'kits/python/**'
      - 'kits/typescript/packages/ui/**'
      - 'kits/typescript/packages/librarian/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/factory-selftest.yaml'
  workflow_dispatch:
    inputs:
      macos-signing-identity:
        description: Existing certificate fingerprint; runs only the native signing proof when supplied.
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos-signing:
    name: Native macOS signing proof
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.macos-signing-identity != '' }}
    runs-on: ['self-hosted', 'macos']
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Build twice with the real signing runner and verify identity
        env:
          SIGNING_IDENTITY: ${{ inputs.macos-signing-identity }}
        run: nix develop ./kits/rust --command bash tests/desktop/signing-proof.sh "$SIGNING_IDENTITY"

  render-and-test:
    name: Render a scratch app and run its own suite
    if: ${{ !github.event.pull_request.head.repo.fork && inputs.macos-signing-identity == '' }}
    # atlas, not the pool: the private index's LAN address resolves only there (huginn timed out, 24/10/2026).
    runs-on: ['self-hosted', 'household', 'atlas']
    timeout-minutes: 50
    env:
      # Deliberately NOT UV_FROZEN=1. That pin is for a real app's CI, which
      # syncs against a uv.lock a developer already committed; template/ ships
      # no uv.lock at all (every app generates its own on first setup), so a
      # fresh scratch render has nothing to freeze against — `uv sync` here
      # resolves and writes one, exactly as an app's own first setup does.
      # Measured 29/09/2026: UV_FROZEN=1 here fails every run before pytest
      # ever starts, "Unable to find lockfile at `uv.lock`".
      #
      # A subdirectory of the checkout, not a sibling of it (as an earlier cut
      # of this workflow had it) — pnpm/action-setup's package_json_file input
      # resolves relative to GITHUB_WORKSPACE, exactly as frontend-ci.yaml's
      # reusable passes it ('${{ inputs.working-directory }}/package.json');
      # an absolute path outside the workspace measured 29/09/2026 as "No pnpm
      # version is specified" despite the file existing with one, on this
      # runner. Untracked and never staged, so it costs nothing to leave inside
      # the checkout; "Clean up" below removes it regardless.
      SCRATCH: scratch
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # copier reads the commit history to describe the template's own version

      - name: Set up uv
        # astral-sh/setup-uv directly, not master-project's setup-uv wrapper
        # (radar-hooves/master-project/.github/actions/setup-uv): this repo is
        # PUBLIC and cannot reach a private-repo action, the constraint
        # security.yaml records for the golden reusable —
        # by-exception (2026-09-29), same reason. Costs the wrapper's persisted
        # tool-cache trick (a fresh uv download each run instead of a restored
        # one); worth it for a job that runs only on template/copier.yaml/
        # variants.yaml changes, not on every push.
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: '0.9.30' # the household pin (master-project's setup-uv action)

      - name: Desktop signing runner — full contract suite
        run: nix shell nixpkgs#jq --command uv run --frozen pytest -q tests/desktop

      - name: Retirement migration — holds copier.yaml's list to its `_exclude`
        run: uv run --frozen pytest -q tests/migrations

      - name: Copier answers — headless, omitted slices, run mode
        run: uv run --frozen pytest -q tests/template

      - name: Android skeleton — a Rootstock app renders into its module
        # rootstock's :stamp leg builds it, pinned to a tag; this catches a render
        # that fails before any tag carries it.
        run: |
          set -euo pipefail
          uvx copier copy --defaults --vcs-ref=HEAD --data skeleton=android \
            --data project_name=voice-recorder . "$SCRATCH-android/apps/voice-recorder"
          app="$SCRATCH-android/apps/voice-recorder"
          test -f "$app/.copier-answers.yml"
          test -f "$app/src/main/kotlin/com/rootstock/voicerecorder/VoiceRecorderApplication.kt"
          if grep -rn '{{' "$app/src"; then echo "unrendered Jinja in the android stamp" >&2; exit 1; fi

      - name: Arbitrary-values ratchet — the wrapper against the real bin
        run: node --test tests/arbitrary-values/ratchet.test.mjs

      - name: Layout gate — which routes a change names
        run: node --test tests/layout-gate/routes.test.mjs

      - name: Layout ownership gate — what it refuses
        run: node --test tests/layout-ownership/ownership.test.mjs

      - name: Kits — lint, types and test
        # The root uv workspace's own committed lock, so frozen here, unlike
        # the scratch app below. One layer only for each gate: nothing in
        # pre-commit runs them (kits/python/README.md).
        env:
          UV_FROZEN: '1'
        working-directory: kits/python
        run: |
          set -euo pipefail
          for kit in */; do
            (
              cd "$kit"
              uv sync
              uv run ruff format --check src tests
              uv run ruff check src tests
              uv run mypy src tests
              uv run pytest -q
            )
          done

      - name: Render a scratch app (factory_selftest=true)
        # Fixed, throwaway answers: nothing here is deployed or reached over the
        # network. postgres_host/port are never connected to — backend tests run
        # on their own ephemeral testcontainers Postgres (canonical-app-shape.md),
        # not the dev-server address a real app would give. registry_host/
        # registry_credential_file/watchtower_url gate the deploy only, which
        # this job never runs.
        run: |
          set -euo pipefail
          uvx copier copy --defaults --trust --vcs-ref=HEAD \
            --data factory_selftest=true \
            --data project_name=factory-selftest \
            --data description="Factory self-test scratch render — never deployed" \
            --data backend_port=8398 --data frontend_port=5198 --data frontend_e2e_port=5228 \
            --data postgres_host=127.0.0.1 --data postgres_port=5432 \
            --data portcullis_url=http://127.0.0.1:1 \
            --data private_index_name=godswood --data private_index_url=http://172.21.0.2:3141/poodle64/prod/+simple/ \
            --data registry_host=registry.invalid --data registry_credential_file=/dev/null \
            --data watchtower_url=http://127.0.0.1:1 \
            . "$SCRATCH"
        # private_index_url is the one household devpi every real app resolves
        # from, by the LAN address the root pyproject.toml gives, read
        # anonymously from atlas: this public tree names no household host. A
        # real app answers it from its fleet's own declaration.

      - name: Backend — install and test
        # Same sync-args as every real app's change.yaml pipeline: base + dev only, so CI
        # resolves the same packages a real app's CI does, off the household
        # index rather than an editable sibling path — all but the kits, which
        # `uv add --frozen` repoints at this checkout first, in the scratch
        # app's pyproject.toml alone.
        working-directory: ${{ env.SCRATCH }}/backend
        run: |
          for kit in "${GITHUB_WORKSPACE}"/kits/python/*/; do
            uv add --frozen --editable "$kit"
          done
          uv sync --no-default-groups --group dev
          # The stamp must already be in the shape the app's own ruff-format
          # hook leaves it, or a re-stamp can never commit clean.
          uv run ruff format --check .
          uv run pytest -q -n 4

      - name: Listener — answered on the front door's network only
        # The rendered gunicorn.conf.py on a container joined to the front door's network,
        # a telemetry one (a collector) and a third (app-factory#109).
        run: tests/listener/proof.sh "$SCRATCH/backend" 8398

      - name: Set up pnpm
        # Same pin as master-project's frontend-ci.yaml reusable.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ${{ env.SCRATCH }}/frontend/package.json

      - name: Set up Node
        # Same pin as master-project's frontend-ci.yaml reusable. No
        # registry-url/scope, for the same reason that reusable omits it:
        # @poodle64/* is public on npmjs, and setting one here 404s the
        # install (measured 2026-08-14, see that workflow's own comment).
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Frontend — install and test (unit)
        # `pnpm test -- --run`, the same command frontend-ci.yaml's reusable
        # runs for `run-tests: true` — vitest once, not watch mode. No
        # --frozen-lockfile, for the same reason backend sync above carries no
        # UV_FROZEN: template/ ships no pnpm-lock.yaml either, so a scratch
        # render has nothing to freeze against — pnpm resolves and writes one.
        #
        # @poodle64/ui and @poodle64/librarian come from THIS checkout, packed as
        # a publish would ship them, since the stamp may pin a version npm does not have until this
        # merges. `pnpm add` resolves the whole tree around it but does not
        # always run the app's `prepare`, so svelte-kit sync is run by name.
        working-directory: ${{ env.SCRATCH }}/frontend
        run: |
          set -euo pipefail
          (cd "${GITHUB_WORKSPACE}/kits/typescript" && pnpm install --frozen-lockfile && pnpm --filter @poodle64/ui --filter @poodle64/librarian run build)
          pnpm --dir "${GITHUB_WORKSPACE}/kits/typescript" --filter @poodle64/ui pack --pack-destination "${RUNNER_TEMP}"
          pnpm --dir "${GITHUB_WORKSPACE}/kits/typescript" --filter @poodle64/librarian pack --pack-destination "${RUNNER_TEMP}"
          pnpm add \
            "@poodle64/ui@file:$(ls "${RUNNER_TEMP}"/poodle64-ui-*.tgz)" \
            "@poodle64/librarian@file:$(ls "${RUNNER_TEMP}"/poodle64-librarian-*.tgz)"
          # What superforms-field.test.ts renders; a stamp carries none of them.
          pnpm add -D sveltekit-superforms formsnap zod
          pnpm exec svelte-kit sync
          # Same reason as ruff format --check above: the app's prettier hook
          # must change nothing in a fresh stamp.
          pnpm exec prettier --check .
          pnpm test -- --run
          pnpm check

      - name: Stamped pre-commit — the app's own lint hooks over the scratch app
        # What an app runs on its first commit, which `ruff format` and `prettier`
        # alone never did (app-factory#63 and #76 shipped through that gap). Only
        # the hooks that need nothing but the app's own install: the household
        # hooks (pii, history, rules-fence, handoff, template-parity, gitleaks,
        # actionlint) read master-project and run in each app's own CI.
        # design-craft and design-drift need a browser and bank a baseline on a
        # first run, so the Elements step's Chromium is theirs.
        working-directory: ${{ env.SCRATCH }}
        run: |
          set -euo pipefail
          # The Elements step stamps beside this app, and git refuses a nested repo with no commit.
          trap 'rm -rf .git' EXIT
          git init -q
          git add .
          for hook in ruff gateway-only-models stylelint stylelint-svelte eslint \
              design-arbitrary-values colour-surface layout-ownership; do
            uvx pre-commit run "$hook" --all-files
          done

      - name: Frontend — the shell test without the agent slice
        # An app with no chat client (the library) runs the same stamped
        # shell.test.ts: the Ask-row case skips, the rest passes. The slice is
        # set aside for this one file and put back for the steps after it.
        working-directory: ${{ env.SCRATCH }}/frontend
        run: |
          set -euo pipefail
          mv src/lib/agent/chat.ts "$RUNNER_TEMP/chat.ts"
          trap 'mv "$RUNNER_TEMP/chat.ts" src/lib/agent/chat.ts' EXIT
          pnpm exec vitest run src/lib/shell.test.ts

      - name: Elements — one element, two placements, in a real browser
        # The scratch app serves <selftest-card>; the proof stamps a second app in
        # another palette that places it, and drives both pages in Chromium (the
        # host's own, NixOS running no downloaded browser: host-browser.ts).
        run: tests/elements/proof.sh "$SCRATCH"

      - name: Render the other shapes — headless, slices omitted, and both
        # The default render above carries every slice and a front end. These are
        # the shapes an app's answers can ask for instead: `headless`, and the
        # slices that leave the render when omitted (agent, feedback, alerts,
        # files, which go together here). Both extremes of each, so every branch
        # in a template file renders and is run at least once.
        run: |
          set -euo pipefail
          render() {
            dest=$1; shift
            uvx copier copy --defaults --trust --vcs-ref=HEAD \
              --data factory_selftest=true \
              --data project_name=factory-selftest \
              --data description="Factory self-test scratch render — never deployed" \
              --data backend_port=8398 --data frontend_port=5198 --data frontend_e2e_port=5228 \
              --data postgres_host=127.0.0.1 --data postgres_port=5432 \
              --data portcullis_url=http://127.0.0.1:1 \
              --data private_index_name=godswood --data private_index_url=http://172.21.0.2:3141/poodle64/prod/+simple/ \
              --data registry_host=registry.invalid --data registry_credential_file=/dev/null \
              --data watchtower_url=http://127.0.0.1:1 \
              "$@" . "$dest"
          }
          lean='omitted_slices=[agent, alerts, feedback, files]'
          render "$SCRATCH-headless" --data headless=true
          render "$SCRATCH-headless-lean" --data headless=true --data "$lean"
          render "$SCRATCH-lean" --data "$lean"
          test ! -e "$SCRATCH-headless/frontend"
          test ! -e "$SCRATCH-headless-lean/backend/src/factory_selftest/api/agent"
          if grep -q claude "$SCRATCH-headless-lean/Dockerfile"; then echo "Claude Code installed without the agent slice" >&2; exit 1; fi

      - name: Other shapes — backend install, lint and test
        # Each takes only the kits its own pyproject names: a lean render that
        # declares no agent must not get agent-common back from this loop.
        run: |
          set -euo pipefail
          for app in "$SCRATCH-headless" "$SCRATCH-headless-lean" "$SCRATCH-lean"; do
            (
              cd "$app/backend"
              for kit in "${GITHUB_WORKSPACE}"/kits/python/*/; do
                if grep -q "\"$(basename "$kit")>=" pyproject.toml; then uv add --frozen --editable "$kit"; fi
              done
              uv sync --no-default-groups --group dev
              uv run ruff format --check .
              uv run ruff check .
              uv run mypy src
            )
          done
          for app in "$SCRATCH-headless" "$SCRATCH-headless-lean"; do
            (cd "$app/backend" && uv run pytest -q -n 4)
          done
          # A headless app's own hooks are the backend's alone.
          cd "$SCRATCH-headless-lean"
          trap 'rm -rf .git' EXIT
          git init -q
          git add .
          for hook in ruff gateway-only-models; do
            uvx pre-commit run "$hook" --all-files
          done

      - name: Slices omitted — the frontend without agent, feedback and alerts
        # The shell, the protected layout and the e2e shell spec render without
        # them; the same install, check and suite as the default render's.
        working-directory: ${{ env.SCRATCH }}-lean/frontend
        run: |
          set -euo pipefail
          pnpm add \
            "@poodle64/ui@file:$(ls "${RUNNER_TEMP}"/poodle64-ui-*.tgz)" \
            "@poodle64/librarian@file:$(ls "${RUNNER_TEMP}"/poodle64-librarian-*.tgz)"
          pnpm add -D sveltekit-superforms formsnap zod
          pnpm exec svelte-kit sync
          pnpm exec prettier --check .
          pnpm test -- --run
          pnpm check
          pnpm exec eslint .

      - name: Clean up the scratch renders
        if: always()
        run: rm -rf "$SCRATCH" "$SCRATCH"-*
