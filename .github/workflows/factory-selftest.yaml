name: Factory self-test

# The factory's own answer to master-project#839 NEED 1: "the factory's code is
# tested in the factory." Renders a throwaway app from THIS commit with
# `factory_selftest=true` — the one caller allowed to set it (copier.yaml) — so
# the scratch render carries the ~20 test_*.py/*.test.ts files that assert
# behaviour of a factory-owned module (auth, rate limiting, the admin/agent/
# feedback APIs, vend, the mcp mount…) and that an ordinary stamp no longer
# receives at all. Runs their own suite there, on a rendered app, exactly as a
# real app would run it — never against template/ source directly, which is
# Jinja, not Python or TypeScript.
#
# The agent-common kit (kits/python/agent-common) is tested here too, beside
# the stamp that imports it: its own lint, types and suite first, then the
# render resolves it from THIS checkout rather than the index, so a change to
# kit and slice is proven together before either is released.
#
# Never on the golden reusable callers (python-ci.yaml/frontend-ci.yaml under
# template/.github): those are what copier stamps INTO an app, and inlining
# this job there would ship the factory's own self-test into every app's CI,
# exactly the drift this closes. This workflow lives at THIS repo's own root,
# beside kit-rust.yaml and security.yaml, which is this repo's first-party CI.
#
# Household CI's self-hosted default applies (rules-library/fleet/ci.md): a
# rendered app's BACKEND resolves real dependencies off the household's
# PRIVATE package index (redactyl-core, api-common, the nextcloud client),
# credentialled ambiently on the runner's own file per fleet/ci.md.

on:
  pull_request:
    paths:
      - 'template/**'
      - 'copier.yaml'
      - 'variants.yaml'
      - 'kits/python/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/factory-selftest.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render-and-test:
    name: Render a scratch app and run its own suite
    runs-on: ['self-hosted', 'atlas']
    timeout-minutes: 30
    env:
      # Deliberately NOT UV_FROZEN=1. That pin is for a real app's CI, which
      # syncs against a uv.lock a developer already committed; template/ ships
      # no uv.lock at all (every app generates its own on first setup), so a
      # fresh scratch render has nothing to freeze against — `uv sync` here
      # resolves and writes one, exactly as an app's own first setup does.
      # Measured 29/09/2026: UV_FROZEN=1 here fails every run before pytest
      # ever starts, "Unable to find lockfile at `uv.lock`".
      #
      # A subdirectory of the checkout, not a sibling of it (as an earlier cut
      # of this workflow had it) — pnpm/action-setup's package_json_file input
      # resolves relative to GITHUB_WORKSPACE, exactly as frontend-ci.yaml's
      # reusable passes it ('${{ inputs.working-directory }}/package.json');
      # an absolute path outside the workspace measured 29/09/2026 as "No pnpm
      # version is specified" despite the file existing with one, on this
      # runner. Untracked and never staged, so it costs nothing to leave inside
      # the checkout; "Clean up" below removes it regardless.
      SCRATCH: scratch
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # copier reads the commit history to describe the template's own version

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: '0.9.30' # the household pin (master-project's setup-uv action)

      - name: Kit — lint, types and test
        # The root uv workspace's own committed lock, so frozen here, unlike
        # the scratch app below. One layer only for each gate: nothing in
        # pre-commit runs them (kits/python/README.md).
        env:
          UV_FROZEN: '1'
        working-directory: kits/python/agent-common
        run: |
          uv sync
          uv run ruff format --check src tests
          uv run ruff check src tests
          uv run mypy src tests
          uv run pytest -q

      - name: Render a scratch app (factory_selftest=true)
        # Fixed, throwaway answers: nothing here is deployed or reached over the
        # network. postgres_host/port are never connected to — backend tests run
        # on their own ephemeral testcontainers Postgres (canonical-app-shape.md),
        # not the dev-server address a real app would give. registry_host/
        # registry_credential_file/watchtower_url gate deploy.yaml only, which
        # this job never runs.
        run: |
          set -euo pipefail
          uvx copier copy --defaults --trust --vcs-ref=HEAD \
            --data factory_selftest=true \
            --data project_name=factory-selftest \
            --data description="Factory self-test scratch render — never deployed" \
            --data backend_port=8398 --data frontend_port=5198 --data frontend_e2e_port=5228 \
            --data postgres_host=127.0.0.1 --data postgres_port=5432 \
            --data portcullis_url=http://127.0.0.1:1 \
            --data private_index_name=godswood --data private_index_url=https://pypi.godswood.au/poodle64/prod/+simple/ \
            --data registry_host=registry.invalid --data registry_credential_file=/dev/null \
            --data watchtower_url=http://127.0.0.1:1 \
            . "$SCRATCH"
        # private_index_name/url are the SAME values every real app's own
        # .copier-answers.yml carries (one shared devpi instance) — not a
        # credential, and read access is the runner's own ambient netrc
        # (fleet/ci.md), the same mechanism every stamped app's own CI already
        # relies on to resolve these same packages.

      - name: Backend — install and test
        # Same sync-args as every real app's python-ci.yaml caller
        # (template/.github/workflows/python-ci.yaml.jinja): base + dev only, so CI
        # resolves the same packages a real app's CI does, off the household
        # index rather than an editable sibling path — all but agent-common,
        # which `uv add --frozen` repoints at this checkout's kit first, in the
        # scratch app's pyproject.toml alone.
        working-directory: ${{ env.SCRATCH }}/backend
        run: |
          uv add --frozen --editable "${GITHUB_WORKSPACE}/kits/python/agent-common"
          uv sync --no-default-groups --group dev
          uv run pytest -q -n 8 --dist loadfile

      - name: Set up pnpm
        # Same pin as master-project's frontend-ci.yaml reusable.
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: ${{ env.SCRATCH }}/frontend/package.json

      - name: Set up Node
        # Same pin as master-project's frontend-ci.yaml reusable. No
        # registry-url/scope, for the same reason that reusable omits it:
        # @poodle64/* is public on npmjs, and setting one here 404s the
        # install (measured 2026-08-14, see that workflow's own comment).
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Frontend — install and test (unit)
        # `pnpm test -- --run`, the same command frontend-ci.yaml's reusable
        # runs for `run-tests: true` — vitest once, not watch mode. No
        # --frozen-lockfile, for the same reason backend sync above carries no
        # UV_FROZEN: template/ ships no pnpm-lock.yaml either, so a scratch
        # render has nothing to freeze against — pnpm resolves and writes one.
        working-directory: ${{ env.SCRATCH }}/frontend
        run: |
          pnpm install
          pnpm test -- --run

      - name: Clean up the scratch render
        if: always()
        run: rm -rf "$SCRATCH"

      - name: Notify failure (ntfy infra)
        if: failure()
        uses: radar-hooves/master-project/.github/actions/ntfy-failure@main
        with:
          title: '${{ github.repository }}: factory self-test failed'
