name: Publish kits/typescript

# Publishes each public package of kits/typescript (@poodle64/design-tokens,
# @poodle64/ui, @poodle64/librarian) to public npm when main carries a
# package.json `version` npm does not have yet. A release is that bump, merged.
# There is no package tag: copier records `git describe --tags` as an app's
# `_commit`, so a package tag here would stamp apps with it in place of this
# repo's vYYYY.M.x factory release. npm records the commit a version came from:
# `npm view @poodle64/<package>@<version> gitHead`.
#
# Authenticates by OIDC trusted publishing: there is NO npm token and no
# NPM_TOKEN secret. npm matches this repository and this workflow's FILENAME
# against the trusted publisher configured on each package, and signs a
# provenance attestation, which it checks against each package.json's
# `repository.url`. Renaming this file, or moving the publish step into a
# reusable workflow, breaks publishing until every package's trusted publisher
# is re-made on npmjs (docs/master/reference/guide-package-distribution.md in
# master-project).
#
# by-exception: a GitHub-hosted runner, because npm trusted publishing does not
# support self-hosted runners (docs.npmjs.com/trusted-publishers); an OIDC
# publish from atlas fails ENEEDAUTH. Never pull_request. A dispatch on main
# re-runs a publish that failed; a dispatch on any other ref is a dry run of the
# same steps.

on:
  push:
    branches: [main]
    paths: ['kits/typescript/packages/*/package.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # the OIDC token npm exchanges for publish rights
    defaults:
      run:
        working-directory: kits/typescript
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: kits/typescript/package.json

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          scope: '@poodle64'

      # Node 22 bundles npm 10.x, and OIDC publishing needs npm >= 11.5.1.
      # Lifting npm alone keeps the toolchain identical to kit-typescript.yaml.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1

      # Only a 404 means unpublished; any other failure stops the run rather
      # than reading as "nothing to release".
      - name: Find versions npm does not have
        id: pending
        run: |
          set -euo pipefail
          dirs=""
          for manifest in packages/*/package.json; do
            spec=$(node -p "const p = require('./$manifest'); p.private ? '' : p.name + '@' + p.version")
            [ -n "$spec" ] || continue
            if out=$(npm view "$spec" version 2>&1); then
              echo "$spec is on npm"
            elif grep -q E404 <<<"$out"; then
              echo "$spec is new"
              dirs="$dirs ${manifest%/package.json}"
            else
              printf '%s\n' "$out" >&2
              exit 1
            fi
          done
          echo "dirs=${dirs# }" >> "$GITHUB_OUTPUT"

      - name: Install
        if: steps.pending.outputs.dirs != ''
        run: pnpm install --frozen-lockfile

      # The commit never necessarily went through kit-typescript.yaml, so each
      # package's own build and test run here too. The trailing "..." selects the
      # package AND its workspace dependencies in dependency order: @poodle64/ui's
      # tests compile against design-tokens' generated dist/.
      - name: Build and test
        if: steps.pending.outputs.dirs != ''
        env:
          DIRS: ${{ steps.pending.outputs.dirs }}
        run: |
          filters=()
          for dir in $DIRS; do filters+=(--filter "{./$dir}..."); done
          pnpm "${filters[@]}" run test

      - name: Publish
        if: steps.pending.outputs.dirs != ''
        env:
          DIRS: ${{ steps.pending.outputs.dirs }}
          npm_config_dry_run: ${{ github.ref != 'refs/heads/main' }} # npm's --dry-run
        run: for dir in $DIRS; do (cd "$dir" && npm publish); done
