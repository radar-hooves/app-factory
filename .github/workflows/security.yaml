name: Security

# Thin caller of the golden reusable (rules-library/core/ci-workflow-standard.md).
# This repo's own first-party code is kits/rust only (template/ is jinja source
# stamped into apps, not runnable code of this repo's own — its own audit runs
# in the scaffolded app via template/.github/workflows/security.yaml.jinja),
# so python and node-dir stay off; trivy-fs still covers kits/rust/Cargo.lock
# (Trivy parses it natively), which is this repo's cargo-audit-equivalent gate
# (rules-library/core/supply-chain.md).
#
# Weekly, and on a dependency change, matching the reusable's own reasoning:
# CVEs arrive with time, not with commits, and pre-commit already runs
# gitleaks on every commit.
on:
  schedule:
    - cron: '0 18 * * 0' # Monday 04:00 AEST
  push:
    branches-ignore: [main]
    paths:
      - 'kits/rust/**/Cargo.lock'
      - '.github/workflows/security.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    uses: radar-hooves/master-project/.github/workflows/security-checks.yaml@main
    permissions:
      contents: read
    with:
      python: false
