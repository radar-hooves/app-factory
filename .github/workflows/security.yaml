name: Security

# Supply-chain and secret scanning for @poodle64/design-tokens and
# @poodle64/ui — the two packages this repo publishes to every app in the
# estate — on every push to main, every PR, and on demand: a gitleaks secret
# scan plus a Trivy filesystem scan (dependency vulnerabilities + working-tree
# secrets).
#
# by-exception: a BESPOKE in-repo workflow, not the estate thin caller of
# radar-hooves/master-project's security-checks.yaml reusable
# (ci-workflow-standard.md §"The factory, in preference order"). GitHub does not
# let a public repository call a reusable workflow or composite action in a
# private one: the run dies at startup with an empty job list (runs
# 31097907321 and 31363763671; master-project#169). For the same reason there
# is no ntfy-failure step; failures surface in the run and PR UI.
#
# Jobs run on [self-hosted, atlas], except a fork's pull request, which runs on
# a GitHub-hosted runner so outside code never reaches atlas.
#
# The scan mechanics track the estate reusable's intent, adapted to
# ubuntu-latest: gitleaks runs as the pinned CLI (the reusable's explicit
# choice over the commercial gitleaks/gitleaks-action), scanning full history
# rather than a bounded commit range — the reusable scopes to a range only to
# avoid pre-existing history findings turning a repo red, and this repo's
# history is clean (verified 2026-08-11: 108 commits, no leaks), so the
# simpler, stricter full-history scan stays green until a real secret lands.
# Trivy over the committed pnpm-lock.yaml is the same dependency-audit path the
# reusable uses for Node repos (npm retired the audit endpoint pnpm audit
# relies on, so Trivy parses the lockfile against GHSA directly).

# Weekly, and on a dependency change: CVEs arrive with time, not with commits,
# and pre-commit already runs gitleaks on every commit. Measured 06/09/2026:
# on every push this was 3-5 runner jobs per commit across 22 repos, a third
# of the fleet's runs.
on:
  schedule:
    - cron: '0 18 * * 0' # Monday 04:00 AEST
  pull_request:
    paths:
      - '**/pyproject.toml'
      - '**/uv.lock'
      - '**/package.json'
      - '**/pnpm-lock.yaml'
      - '**/Cargo.lock'
      - '**/go.sum'
      - '**/Dockerfile*'
      - '.github/workflows/security.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","atlas"]') }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history so the secret scan sees every commit, not just the tip.
          fetch-depth: 0

      - name: Scan for secrets (gitleaks CLI)
        # Pinned release binary, checksum-verified — no third-party action on
        # the supply chain (ci-workflow-standard.md: SHA-pin third-party
        # actions; here the equivalent is a version+sha256-pinned binary).
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          curl -fsSL "$url" -o "$tarball"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          # --redact is not optional: without it a real finding prints the
          # secret into the run log, turning the guard into the leak
          # (core/secret-handling.md).
          ./gitleaks detect --source . --redact --no-banner --verbose

  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","atlas"]') }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Trivy filesystem scan
        # Dependency vulnerabilities (over the committed pnpm-lock.yaml) plus
        # working-tree secrets, in one pass. ignore-unfixed keeps the gate on
        # what a version bump can actually fix.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
