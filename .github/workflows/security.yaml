name: Security

# Thin caller of the golden reusable (rules-library/core/ci-workflow-standard.md):
# secret scan (gitleaks), Python dependency audit (pip-audit), Trivy filesystem
# scan, and a CycloneDX SBOM artefact. Weekly and on a dependency change: CVEs
# arrive with time, not with commits, and pre-commit runs gitleaks per commit.
on:
  schedule:
    - cron: '0 18 * * 0' # Monday 04:00 AEST
  pull_request:
    paths:
      - '**/pyproject.toml'
      - '**/uv.lock'
      - '**/package.json'
      - '**/pnpm-lock.yaml'
      - '**/Cargo.lock'
      - '**/go.sum'
      - '**/Dockerfile*'
      - '.github/workflows/security.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    uses: radar-hooves/master-project/.github/workflows/security-checks.yaml@main
