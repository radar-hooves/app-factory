name: Security

# Supply-chain and secret scanning for @poodle64/design-tokens and
# @poodle64/ui — the two packages this repo publishes to every app in the
# estate — on every push to main, every PR, and on demand: a gitleaks secret
# scan plus a Trivy filesystem scan (dependency vulnerabilities + working-tree
# secrets).
#
# by-exception (2026-08-11): this is a BESPOKE in-repo workflow, not the estate
# standard thin caller of radar-hooves/master-project's security-checks.yaml
# reusable (ci-workflow-standard.md §"The factory, in preference order",
# preference 1). It COULD NOT be the thin caller while design-system was PUBLIC
# and master-project, which hosts the shared reusable, is PRIVATE — GitHub does
# not
# let a public repository call a reusable workflow (or a composite action) that
# lives in a private one — the run never reaches a job, it dies at startup
# validation with "This run likely failed because of a workflow file issue" and
# an empty job list. Proven twice on this repo: runs 31097907321 (2026-08-06)
# and 31363763671 (2026-08-10), both 0 jobs, both 0s, both shown by filename
# because the name never parsed. Preference 3 (bespoke) applies because
# preferences 1 and 2 genuinely do not fit; recorded on
# radar-hooves/master-project#169.
#
# SUPERSEDED 2026-09-04: this repo went PRIVATE, so the blocking condition is
# gone and every exception below rests on it. A private repo may call the
# private reusable, may run on [self-hosted, atlas], and may use the private
# ntfy-failure composite action. This file should collapse back to the golden
# thin caller; it has not yet, because that needs a verified run rather than a
# comment. The #169 estate-wide fix is no longer needed FOR THIS REPO, though
# it still stands for any repo that must genuinely stay public.
#
# by-exception (2026-08-11): GitHub-hosted runners (ubuntu-latest), not the
# self-hosted [self-hosted, atlas] label the reusable and every private repo
# default to — exposing a self-hosted runner to a public repo is a fork-PR
# execution risk. This matches the same dated deviation already recorded in
# ci.yaml and publish.yaml for this public repo.
#
# by-exception (2026-08-11): no ntfy-failure notify step. That composite action
# also lives in the private master-project and so is likewise unusable from a
# public repo, and this repo holds no NTFY_TOKEN secret for the inline-curl
# fallback (ci-workflow-standard.md §failure-notify). Failures surface in the
# GitHub run/PR UI, which the operator watches directly — the same no-notify
# convention already in ci.yaml and publish.yaml.
#
# The scan mechanics track the estate reusable's intent, adapted to
# ubuntu-latest: gitleaks runs as the pinned CLI (the reusable's explicit
# choice over the commercial gitleaks/gitleaks-action), scanning full history
# rather than a bounded commit range — the reusable scopes to a range only to
# avoid pre-existing history findings turning a repo red, and this repo's
# history is clean (verified 2026-08-11: 108 commits, no leaks), so the
# simpler, stricter full-history scan stays green until a real secret lands.
# Trivy over the committed pnpm-lock.yaml is the same dependency-audit path the
# reusable uses for Node repos (npm retired the audit endpoint pnpm audit
# relies on, so Trivy parses the lockfile against GHSA directly).

# Weekly, and on a dependency change: CVEs arrive with time, not with commits,
# and pre-commit already runs gitleaks on every commit. Measured 06/09/2026:
# on every push this was 3-5 runner jobs per commit across 22 repos, a third
# of the fleet's runs.
on:
  schedule:
    - cron: '0 18 * * 0' # Monday 04:00 AEST
  push:
    branches: [main]
    paths:
      - '**/pyproject.toml'
      - '**/uv.lock'
      - '**/package.json'
      - '**/pnpm-lock.yaml'
      - '**/Cargo.lock'
      - '**/go.sum'
      - '**/Dockerfile*'
      - '.github/workflows/security.yaml'
  pull_request:
    paths:
      - '**/pyproject.toml'
      - '**/uv.lock'
      - '**/package.json'
      - '**/pnpm-lock.yaml'
      - '**/Cargo.lock'
      - '**/go.sum'
      - '**/Dockerfile*'
      - '.github/workflows/security.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history so the secret scan sees every commit, not just the tip.
          fetch-depth: 0

      - name: Scan for secrets (gitleaks CLI)
        # Pinned release binary, checksum-verified — no third-party action on
        # the supply chain (ci-workflow-standard.md: SHA-pin third-party
        # actions; here the equivalent is a version+sha256-pinned binary).
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          curl -fsSL "$url" -o "$tarball"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          # --redact is not optional: without it a real finding prints the
          # secret into the run log, turning the guard into the leak
          # (core/secret-handling.md).
          ./gitleaks detect --source . --redact --no-banner --verbose

  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Trivy filesystem scan
        # Dependency vulnerabilities (over the committed pnpm-lock.yaml) plus
        # working-tree secrets, in one pass. ignore-unfixed keeps the gate on
        # what a version bump can actually fix.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
