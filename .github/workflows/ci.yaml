name: CI

# The one fast gate on every push to main and every PR: format, clippy, test.
# A library with no platform-specific code, so one target is the whole matrix.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yaml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    # by-exception (2026-09-07): no self-hosted runner is registered for this
    # repo (`gh api repos/poodle64/telemetry-rs/actions/runners` → 0), so a
    # `self-hosted` job would queue forever; registering one is a yggdrasil
    # change plus a rebuild on atlas. The repo is PUBLIC, so vendor-hosted
    # minutes are unbilled, and atlas's runner carries no ambient Rust — the
    # household's Rust-on-atlas pattern needs a flake devShell this crate does
    # not have. Move to `[self-hosted, atlas]` once the runner is registered.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Notify failure (ntfy infra)
        if: failure() && github.event_name != 'pull_request'
        shell: bash
        env:
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # This repo is PUBLIC and poodle64/master-project is private, so the
          # ntfy-failure composite action cannot be resolved at job-setup time;
          # the household CI standard has a public repo inline the curl.
          if [ -z "$NTFY_TOKEN" ]; then
            echo "::warning::ntfy-failure: no NTFY_TOKEN secret — notification NOT sent"
            exit 0
          fi
          curl -sS --max-time 10 \
            -H "Authorization: Bearer $NTFY_TOKEN" \
            -H "Title: telemetry: rust CI failed" \
            -H "Priority: 4" \
            -H "Tags: rotating_light" \
            -d "Run: $RUN_URL" \
            "https://ntfy.example.com/infra" \
            || echo "::warning::ntfy notify POST failed"
