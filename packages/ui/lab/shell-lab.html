<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shell Lab</title>
<!--
  A sandbox for shell CHROME — the top bar, the rail, the page header, the
  content measure — in plain HTML, so a shape can be looked at before it is
  built.

  Deliberately NOT the harness next door. `packages/ui/harness/` imports the
  real AppShell from dist/ and proves how the shipped component behaves; it is
  what CI drives. It therefore cannot render a shape that does not exist yet,
  which is exactly what this is for. Harness verifies, lab explores.

  No build step and no server: open the file. That constraint is the point —
  a tool that needs `pnpm dev` before you can think is a tool you stop reaching
  for. It costs a copied token block (below) and classic scripts instead of
  modules; both are worth it.

  App profiles come from ./apps.local.js if it is present (gitignored — it
  carries real app names, nav trees and copy). Without it you get the neutral
  demo profile defined at the bottom, which is what a fresh clone sees.
-->
<style>
/* ── Tokens, copied from packages/design-tokens/dist/tokens.css ─────────────
   A copy, because file:// cannot fetch and this file must open standalone.
   If it ever disagrees with the package, the package is right.             */
:root {
  --ds-radius-sm: .225rem; --ds-radius-md: .425rem; --ds-radius-lg: .625rem;
  --ds-radius-xl: .825rem; --ds-radius-full: 9999px;
  --ds-text-2xs: .6875rem;
  --ds-font-display: 'Fraunces', ui-serif, Georgia, serif;
  --ds-font-body: 'Avenir Next', 'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, sans-serif;
  --ds-font-code: 'JetBrains Mono', ui-monospace, 'SF Mono', monospace;

  --ds-color-background: oklch(.905 .005 85);
  --ds-color-foreground: oklch(.240 .016 85);
  --ds-color-surface-1: oklch(.878 .007 85);
  --ds-color-surface-2: oklch(.990 .002 85);
  --ds-color-surface-3: oklch(1 0 0);
  --ds-color-muted-foreground: oklch(.475 .013 85);
  --ds-color-border: oklch(.770 .011 85);
  --ds-color-border-strong: oklch(.588 .015 85);
  --ds-color-primary: oklch(.50 .155 var(--app-hue, 250));
  --ds-color-primary-foreground: oklch(.99 .005 var(--app-hue, 250));
  --ds-color-status-success: oklch(.50 .155 150);
  --ds-color-status-warning: oklch(.52 .130 68);
  --ds-color-status-error: oklch(.53 .200 27);

  --ds-shell-rail-width: 15.5rem;
  --ds-shell-rail-width-collapsed: 3.5rem;
  --ds-shell-measure-prose: 72ch;
  --ds-shell-measure-page: 80rem;
  --ds-shell-measure-wide: 120rem;
  --ds-shell-texture-grid-pitch: 24px;
  --ds-shell-texture-grid-ink: oklch(.68 .02 250 / .5);
}
.dark {
  --ds-color-background: oklch(.205 .015 260);
  --ds-color-foreground: oklch(.930 .010 240);
  --ds-color-surface-1: oklch(.168 .017 260);
  --ds-color-surface-2: oklch(.278 .020 260);
  --ds-color-surface-3: oklch(.332 .022 260);
  --ds-color-muted-foreground: oklch(.712 .015 250);
  --ds-color-border: oklch(.455 .024 260);
  --ds-color-border-strong: oklch(.605 .026 260);
  --ds-color-primary: oklch(.70 .140 var(--app-hue, 250));
  --ds-color-primary-foreground: oklch(.20 .030 var(--app-hue, 250));
  --ds-color-status-success: oklch(.76 .150 150);
  --ds-color-status-warning: oklch(.82 .140 75);
  --ds-color-status-error: oklch(.70 .180 25);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; font-family: var(--ds-font-body); font-size: 14px;
  background: #0e1014; color: var(--ds-color-foreground);
  display: flex; flex-direction: column; overflow: hidden;
}

/* ── Control deck. Harness chrome, deliberately NOT design-system styled ─── */
#deck {
  flex: none; background: #14161c; color: #d7dbe3; border-bottom: 2px solid #2b2f3a;
  font: 11.5px var(--ds-font-code); user-select: none;
}
#deck .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 7px 14px; }
#deck .row + .row { border-top: 1px solid #23262f; }
.grp { display: flex; align-items: center; gap: 5px; }
.grp > .lbl {
  color: #6f778a; text-transform: uppercase; letter-spacing: .1em;
  font-size: 9.5px; margin-right: 2px;
}
#deck button {
  font: inherit; padding: 4px 9px; border-radius: 4px; cursor: pointer;
  background: #22262f; color: #cfd4de; border: 1px solid #363b47; white-space: nowrap;
}
#deck button:hover { background: #2c313c; color: #fff; }
#deck button[aria-pressed="true"] {
  background: var(--ds-color-primary); border-color: var(--ds-color-primary);
  color: #fff; font-weight: 600;
}
#deck select {
  font: inherit; padding: 4px 8px; border-radius: 4px;
  background: #22262f; color: #cfd4de; border: 1px solid #363b47; cursor: pointer;
}
#readout { margin-left: auto; color: #8892a4; display: flex; gap: 16px; flex-wrap: wrap; }
#readout b { color: #f2c14e; font-weight: 600; }
#readout .bad { color: #ef6f6f; }
#readout .good { color: #63c98a; }

/* ── Stage: lets a narrow viewport be simulated inside a wide window ─────── */
#stage {
  flex: 1; min-height: 0; display: flex; justify-content: center;
  background: #0e1014; padding: 0;
}
#stage[data-w] { padding: 12px; }
#frame {
  width: 100%; height: 100%; display: flex; min-width: 0;
  background: var(--ds-color-background);
  container-type: inline-size;
}
#stage[data-w] #frame {
  border: 1px solid #2b2f3a; border-radius: 6px; overflow: hidden;
  box-shadow: 0 8px 40px rgb(0 0 0 / .45);
}

/* ── Rail ────────────────────────────────────────────────────────────────── */
.rail {
  width: var(--ds-shell-rail-width); flex: none; display: flex; flex-direction: column;
  background: var(--ds-color-surface-1); border-right: 1px solid var(--ds-color-border);
  transition: width .15s ease;
}
body[data-rail="collapsed"] .rail { width: var(--ds-shell-rail-width-collapsed); }
body[data-rail="collapsed"] .rail .lbl-text,
body[data-rail="collapsed"] .rail .brand-name,
body[data-rail="collapsed"] .rail .nav-head { display: none; }
body[data-rail="collapsed"] .rail .nav-item { justify-content: center; padding: 0; }
body[data-rail="collapsed"] .rail .rail-head { justify-content: center; padding: 0; }
body[data-rail="collapsed"] .rail .rail-toggle { display: none; }
body[data-rail="collapsed"] #rail-children { display: none !important; }

.rail-head { height: 56px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 16px; }
.brand-mark {
  width: 28px; height: 28px; flex: none; display: grid; place-items: center;
  border: 1px solid var(--ds-color-border); border-radius: var(--ds-radius-md);
  background: var(--ds-color-background); font-size: 14px;
}
.brand-name { font-family: var(--ds-font-display); font-weight: 600; letter-spacing: -.01em; font-size: 15px; }
.rail-toggle {
  margin-left: auto; width: 28px; height: 28px; display: grid; place-items: center;
  border-radius: var(--ds-radius-sm); color: var(--ds-color-muted-foreground); cursor: pointer;
}
.rail-toggle:hover { background: var(--ds-color-surface-2); color: var(--ds-color-foreground); }
.rail-nav { padding: 6px 10px; overflow-y: auto; overflow-x: hidden; }
.nav-head {
  font-size: 9.5px; text-transform: uppercase; letter-spacing: .11em;
  color: var(--ds-color-muted-foreground); padding: 15px 8px 5px;
}
.nav-item {
  display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 8px;
  border-radius: var(--ds-radius-md); color: var(--ds-color-foreground);
  font-size: 13.5px; cursor: pointer; white-space: nowrap;
}
.nav-item:hover { background: var(--ds-color-surface-2); }
.nav-item.active { background: var(--ds-color-surface-2); font-weight: 600; }
.nav-item.child { padding-left: 30px; font-size: 13px; }
.nav-item .ico { width: 16px; flex: none; text-align: center; opacity: .75; font-size: 13px; }

.pane { flex: 1; min-width: 0; display: flex; flex-direction: column; }

/* ── Global bar ──────────────────────────────────────────────────────────── */
.bar {
  height: 56px; flex: none; display: flex; align-items: center; gap: 12px;
  padding: 0 20px; background: var(--ds-color-surface-1);
  border-bottom: 1px solid var(--ds-color-border);
}
.crumb { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 14px; }
.crumb .sep { color: var(--ds-color-muted-foreground); opacity: .55; }
.crumb .up { color: var(--ds-color-muted-foreground); cursor: pointer; }
.crumb .up:hover { color: var(--ds-color-foreground); text-decoration: underline; }
.crumb .here { font-weight: 600; }
.bar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; flex: none; }
.search {
  display: flex; align-items: center; gap: 9px; height: 34px; padding: 0 11px;
  border: 1px solid var(--ds-color-border); border-radius: var(--ds-radius-md);
  background: var(--ds-color-background); color: var(--ds-color-muted-foreground);
  font-size: 13px; cursor: pointer; min-width: 0;
}
.search.lead { width: clamp(200px, 32vw, 560px); }
.search.trail { width: clamp(180px, 22vw, 380px); }
.search .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.search:hover { border-color: var(--ds-color-border-strong); }
.search .kbd {
  margin-left: auto; flex: none; font: 10px var(--ds-font-code); padding: 2px 5px;
  border: 1px solid var(--ds-color-border); border-radius: var(--ds-radius-sm);
}
.iconbtn {
  width: 34px; height: 34px; display: grid; place-items: center; flex: none;
  border: 1px solid var(--ds-color-border); border-radius: var(--ds-radius-md);
  color: var(--ds-color-muted-foreground); cursor: pointer; background: transparent;
}
.iconbtn:hover { color: var(--ds-color-foreground); border-color: var(--ds-color-border-strong); }
.identity {
  display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 9px 0 5px;
  border-radius: var(--ds-radius-md); cursor: pointer;
}
.identity:hover { background: var(--ds-color-surface-2); }
.avatar {
  width: 26px; height: 26px; flex: none; border-radius: var(--ds-radius-full);
  display: grid; place-items: center; background: var(--ds-color-primary);
  color: var(--ds-color-primary-foreground); font: 700 11px var(--ds-font-body);
}
.identity .who { font-size: 13px; white-space: nowrap; }
.identity .caret { color: var(--ds-color-muted-foreground); font-size: 10px; }
body[data-identity="avatar"] .identity .who,
body[data-identity="avatar"] .identity .caret { display: none; }
body[data-identity="none"] .identity { display: none; }

/* ── Context row ─────────────────────────────────────────────────────────── */
.ctx {
  height: 44px; flex: none; display: flex;
  background: var(--ds-color-background); border-bottom: 1px solid var(--ds-color-border);
}
/* Aligns to the CONTENT measure, not the pane edges — anchored to the pane at
   3360px the scope chips sat ~1100px right of the table they scope. */
.ctx-inner {
  width: 100%; margin-inline: auto; padding-inline: 32px;
  display: flex; align-items: center; gap: 2px; min-width: 0;
}
.tab {
  position: relative; height: 44px; display: flex; align-items: center; padding: 0 12px;
  font-size: 13.5px; color: var(--ds-color-muted-foreground); cursor: pointer; white-space: nowrap;
}
.tab:hover { color: var(--ds-color-foreground); }
.tab.active { color: var(--ds-color-foreground); font-weight: 600; }
.tab.active::after {
  content: ''; position: absolute; left: 10px; right: 10px; bottom: 0;
  height: 2px; background: var(--ds-color-primary); border-radius: 2px 2px 0 0;
}
.tab .count {
  margin-left: 7px; font: 10px var(--ds-font-code);
  background: var(--ds-color-surface-2); color: var(--ds-color-muted-foreground);
  padding: 1px 5px; border-radius: var(--ds-radius-full);
}
.ctx-right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; }
.chip {
  display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 10px;
  border: 1px solid var(--ds-color-border); border-radius: var(--ds-radius-md);
  background: var(--ds-color-surface-1); font-size: 12.5px; cursor: pointer; white-space: nowrap;
}
.chip:hover { border-color: var(--ds-color-border-strong); }
.chip .k { color: var(--ds-color-muted-foreground); }
.chip .caret { color: var(--ds-color-muted-foreground); font-size: 9px; }

/* ── Scroller and measure ────────────────────────────────────────────────── */
.scroll {
  flex: 1; min-height: 0; overflow-y: auto; position: relative;
  background-image: radial-gradient(var(--ds-shell-texture-grid-ink) .5px, transparent .5px);
  background-size: var(--ds-shell-texture-grid-pitch) var(--ds-shell-texture-grid-pitch);
  background-attachment: local;
}
body[data-texture="off"] .scroll { background-image: none; }
.measure { width: 100%; margin-inline: auto; padding: 26px 32px 60px; position: relative; }
body[data-measure="prose"] .measure,
body[data-measure="prose"] .ctx-inner { max-width: var(--ds-shell-measure-prose); }
body[data-measure="page"]  .measure,
body[data-measure="page"]  .ctx-inner { max-width: var(--ds-shell-measure-page); }
body[data-measure="wide"]  .measure,
body[data-measure="wide"]  .ctx-inner { max-width: var(--ds-shell-measure-wide); }
body[data-measure="fill"]  .measure,
body[data-measure="fill"]  .ctx-inner { max-width: none; }

/* Dead-space overlay */
body[data-dead="on"] .measure::before,
body[data-dead="on"] .measure::after {
  content: 'unused'; position: absolute; top: 0; bottom: 0; width: 50vw;
  font: 10px var(--ds-font-code); color: oklch(.62 .18 27 / .9);
  letter-spacing: .3em; text-transform: uppercase;
  writing-mode: vertical-rl; display: grid; place-items: center;
  background: repeating-linear-gradient(135deg,
    oklch(.62 .18 27 / .10) 0 6px, transparent 6px 12px);
  pointer-events: none;
}
body[data-dead="on"] .measure::before { right: 100%; }
body[data-dead="on"] .measure::after { left: 100%; }
body[data-dead="on"] .bar-gap { background: repeating-linear-gradient(135deg,
  oklch(.62 .18 27 / .12) 0 6px, transparent 6px 12px); height: 34px; border-radius: 4px; }

/* ── Page header ─────────────────────────────────────────────────────────── */
.pagehead { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 22px; }
.eyebrow {
  font-size: var(--ds-text-2xs); text-transform: uppercase; letter-spacing: .14em;
  color: var(--ds-color-primary); font-weight: 600; margin-bottom: 5px;
}
h1 {
  font-family: var(--ds-font-display); font-size: 28px; font-weight: 600;
  letter-spacing: -.02em; line-height: 1.15; margin: 0;
}
.sub { color: var(--ds-color-muted-foreground); font-size: 13.5px; margin-top: 6px; }
.pagehead-actions { margin-left: auto; display: flex; gap: 8px; flex: none; }
.btn {
  height: 34px; padding: 0 14px; display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid var(--ds-color-border); border-radius: var(--ds-radius-md);
  background: var(--ds-color-surface-1); font: inherit; font-size: 13px;
  color: var(--ds-color-foreground); cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: var(--ds-color-border-strong); }
.btn.primary {
  background: var(--ds-color-primary); border-color: var(--ds-color-primary);
  color: var(--ds-color-primary-foreground); font-weight: 600;
}

/* In-page context (shapes A and C) */
.inpage { margin-bottom: 20px; }
.inpage.plain .tabrow { display: flex; gap: 2px; border-bottom: 1px solid var(--ds-color-border); }
.inpage.plain .tabrow .tab { height: 38px; }
.inpage.plain .scoperow { display: flex; gap: 8px; margin-top: 14px; }
.inpage.boxed {
  border: 1px solid var(--ds-color-border); border-radius: var(--ds-radius-lg);
  background: var(--ds-color-surface-1); padding: 3px 12px;
  display: flex; align-items: center; gap: 2px;
}
.inpage.boxed .tab { height: 40px; }

/* ── Content archetypes ──────────────────────────────────────────────────── */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-bottom: 20px; }
.stat {
  border: 1px solid var(--ds-color-border); border-radius: var(--ds-radius-lg);
  background: var(--ds-color-surface-2); padding: 15px 17px;
}
.stat .k {
  font-size: var(--ds-text-2xs); text-transform: uppercase; letter-spacing: .1em;
  color: var(--ds-color-muted-foreground); margin-bottom: 7px;
}
.stat .v { font: 600 21px/1.1 var(--ds-font-code); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.stat .v.pos { color: var(--ds-color-status-success); }
.stat .v.neg { color: var(--ds-color-status-error); }

.tiles { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
.tile {
  border: 1px solid var(--ds-color-border); border-radius: var(--ds-radius-lg);
  background: var(--ds-color-surface-2); padding: 18px; display: flex; flex-direction: column; gap: 9px;
}
.tile .ico2 {
  width: 34px; height: 34px; border-radius: var(--ds-radius-md); display: grid; place-items: center;
  background: color-mix(in oklch, var(--ds-color-primary) 14%, transparent);
  color: var(--ds-color-primary); font-size: 15px;
}
.tile h3 { font-family: var(--ds-font-display); font-size: 16px; font-weight: 600; margin: 0; }
.tile p { margin: 0; font-size: 13px; color: var(--ds-color-muted-foreground); line-height: 1.5; }

.card {
  border: 1px solid var(--ds-color-border); border-radius: var(--ds-radius-lg);
  background: var(--ds-color-surface-2); overflow: hidden;
}
.card-head { padding: 15px 18px 13px; border-bottom: 1px solid var(--ds-color-border); }
.card-head .t { font-weight: 600; font-size: 14.5px; }
.card-head .d { color: var(--ds-color-muted-foreground); font-size: 12.5px; margin-top: 3px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th {
  text-align: left; font-size: var(--ds-text-2xs); text-transform: uppercase;
  letter-spacing: .09em; color: var(--ds-color-muted-foreground); font-weight: 500;
  padding: 10px 18px; border-bottom: 1px solid var(--ds-color-border); white-space: nowrap;
}
td { padding: 11px 18px; border-bottom: 1px solid var(--ds-color-border); }
tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: var(--ds-color-surface-1); }
td.num, th.num { font-family: var(--ds-font-code); font-variant-numeric: tabular-nums; text-align: right; }
td.num.pos { color: var(--ds-color-status-success); }
td.num.neg { color: var(--ds-color-status-error); }

.prose { font-size: 15px; line-height: 1.72; }
.prose h2 { font-family: var(--ds-font-display); font-size: 20px; margin: 30px 0 10px; font-weight: 600; }
.prose p { margin: 0 0 16px; }

.formgrid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12.5px; font-weight: 600; }
.field .hint { font-size: 12px; color: var(--ds-color-muted-foreground); }
.field .input {
  height: 36px; border: 1px solid var(--ds-color-border); border-radius: var(--ds-radius-md);
  background: var(--ds-color-surface-2); display: flex; align-items: center;
  padding: 0 11px; font-size: 13px; color: var(--ds-color-muted-foreground);
}

.note {
  margin-top: 28px; padding: 13px 16px; font-size: 12.5px; line-height: 1.6;
  border-left: 3px solid var(--ds-color-primary); background: var(--ds-color-surface-1);
  color: var(--ds-color-muted-foreground); border-radius: 0 var(--ds-radius-md) var(--ds-radius-md) 0;
}
.note b { color: var(--ds-color-foreground); font-weight: 600; }
[hidden] { display: none !important; }
</style>
</head>
<body class="dark" data-shape="b" data-measure="wide" data-dead="off"
      data-rail="open" data-identity="full" data-texture="on">

<div id="deck">
  <div class="row">
    <div class="grp"><span class="lbl">App</span><select id="app-pick"></select></div>
    <div class="grp"><span class="lbl">Shape</span>
      <button data-shape="now">Current</button>
      <button data-shape="a">A one-row</button>
      <button data-shape="b">B two-row</button>
      <button data-shape="c">C toolbar</button>
    </div>
    <div class="grp"><span class="lbl">Measure</span>
      <button data-measure="fill">fill</button>
      <button data-measure="wide">wide 120rem</button>
      <button data-measure="page">page 80rem</button>
      <button data-measure="prose">prose 72ch</button>
    </div>
    <div class="grp"><span class="lbl">Content</span>
      <button data-content="dashboard">dashboard</button>
      <button data-content="table">table</button>
      <button data-content="tiles">tiles</button>
      <button data-content="form">form</button>
      <button data-content="prose">prose</button>
    </div>
    <div id="readout"></div>
  </div>
  <div class="row">
    <div class="grp"><span class="lbl">Viewport</span>
      <button data-w="1280">1280</button>
      <button data-w="1512">1512</button>
      <button data-w="1920">1920</button>
      <button data-w="2560">2560</button>
      <button data-w="3360">3360</button>
      <button data-w="">window</button>
    </div>
    <div class="grp"><span class="lbl">Identity</span>
      <button data-identity="full">avatar + name</button>
      <button data-identity="avatar">avatar only</button>
      <button data-identity="none">none</button>
    </div>
    <div class="grp"><span class="lbl">Show</span>
      <button data-t="dead">unused space</button>
      <button data-t="rail">collapse rail</button>
      <button data-t="texture">texture</button>
      <button data-t="theme">dark</button>
    </div>
  </div>
</div>

<div id="stage">
 <div id="frame">
  <aside class="rail">
    <div class="rail-head">
      <span class="brand-mark" id="brand-mark">◈</span>
      <span class="brand-name" id="brand-name">App</span>
      <span class="rail-toggle" id="rail-toggle" title="Collapse rail">▮|</span>
    </div>
    <nav class="rail-nav" id="rail-nav"></nav>
  </aside>

  <div class="pane">
    <header class="bar">
      <div class="search lead" id="search-lead" hidden>
        <span>⌕</span><span class="txt" id="search-txt-l">Search…</span><span class="kbd">⌘K</span>
      </div>
      <div class="bar-gap" id="bar-gap" style="flex:1" hidden></div>
      <div class="crumb" id="crumb" hidden></div>
      <div class="bar-right">
        <div class="search trail" id="search-trail" hidden>
          <span>⌕</span><span class="txt" id="search-txt-t">Search…</span><span class="kbd">⌘K</span>
        </div>
        <button class="iconbtn" title="Theme">◐</button>
        <div class="identity">
          <span class="avatar" id="avatar">AB</span>
          <span class="who" id="who">A. Bee</span>
          <span class="caret">▾</span>
        </div>
      </div>
    </header>

    <div class="ctx" id="ctxrow" hidden><div class="ctx-inner" id="ctx-inner"></div></div>

    <main class="scroll">
      <div class="measure">
        <div class="pagehead">
          <div style="min-width:0">
            <div class="eyebrow" id="eyebrow" hidden></div>
            <h1 id="title">Title</h1>
            <div class="sub" id="subtitle"></div>
          </div>
          <div class="pagehead-actions" id="actions"></div>
        </div>
        <div class="inpage plain" id="inpage-a" hidden>
          <div class="tabrow" id="inpage-a-tabs"></div>
          <div class="scoperow" id="inpage-a-scope"></div>
        </div>
        <div class="inpage boxed" id="inpage-c" hidden></div>
        <div id="content"></div>
        <div class="note" id="note"></div>
      </div>
    </main>
  </div>
 </div>
</div>

<!-- Private profiles, if present. Gitignored; absent in a fresh clone. -->
<script src="./apps.local.js" onerror="void 0"></script>
<script>
/* ── The neutral profile a fresh clone sees ──────────────────────────────── */
const DEMO = [{
  id: 'demo', name: 'Acme', mark: '◈', hue: 250, initials: 'AB', who: 'A. Bee',
  searchLabel: 'Search Acme…',
  nav: [
    { group: null, items: [ {label:'Home', icon:'⌂'}, {label:'Inbox', icon:'▤'} ] },
    { group: 'Records', items: [
        {label:'Customers', icon:'◎'},
        {label:'Invoices', icon:'▥', active:true,
         children:['Overview','Outstanding','Paid','Disputed','Ledger']},
        {label:'Products', icon:'▦'} ] },
    { group: 'Settings', items: [ {label:'Team', icon:'⛨'}, {label:'Billing', icon:'▣'} ] }
  ],
  crumb: ['Invoices', 'Outstanding'],
  eyebrow: 'Records',
  peers: [ {label:'Overview'}, {label:'Outstanding', active:true},
           {label:'Paid'}, {label:'Disputed'}, {label:'Ledger', count:'1,204'} ],
  scope: [ {k:'Account', v:'All'}, {k:'Period', v:'FY26'} ],
  title: 'Outstanding', subtitle: 'Unpaid invoices, in AUD · 12 accounts · 1,204 events',
  actions: [ {label:'Export'}, {label:'New invoice', primary:true} ]
}];

const APPS = (window.SHELL_LAB_APPS && window.SHELL_LAB_APPS.length)
  ? window.SHELL_LAB_APPS : DEMO;

const NOTES = {
  now: "<b>Current.</b> Search pinned left, identity right, nothing between. No breadcrumb, so the chrome never says where you are — several apps render no page title either. Turn on <b>unused space</b>.",
  a:   "<b>A · one row.</b> Location left, search right beside identity. Peer views and scope stay in the page body under the title, so they scroll away and every app draws them its own way.",
  b:   "<b>B · two rows.</b> Global bar for location and global controls; a 44px context row beneath for peer views and scope, aligned to the content measure and sticky. Peer views leave the rail. The eyebrow goes — the breadcrumb says it.",
  c:   "<b>C · shipped toolbar.</b> A's chrome, but the tab-and-scope row ships as one boxed component under the title so every app draws it identically. Still scrolls away."
};

const CONTENT = {
  dashboard: () => `
    <div class="stats">
      ${['Contributed|$420,000.00|','Withdrawn|$318,450.00|','Net gain|$41,275.60|pos','Return on capital|9.8%|pos']
        .map(s=>{const[k,v,c]=s.split('|');return `<div class="stat"><div class="k">${k}</div><div class="v ${c}">${v}</div></div>`}).join('')}
    </div>${CONTENT.table()}`,
  table: () => `
    <div class="card">
      <div class="card-head"><div class="t">Accounts</div>
        <div class="d">Select an account to see its ledger and detail.</div></div>
      <table><thead><tr>
        <th style="width:30%">Account</th><th>Platform</th><th>Owner</th><th>Status</th>
        <th class="num">Realised</th><th class="num">Events</th>
      </tr></thead><tbody>${ROWS.map(r=>`<tr>
        <td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td>
        <td class="num ${r[4]<0?'neg':'pos'}">${r[4].toLocaleString('en-AU',{minimumFractionDigits:2})}</td>
        <td class="num">${r[5].toLocaleString('en-AU')}</td></tr>`).join('')}</tbody></table>
    </div>`,
  tiles: () => `<div class="tiles">${
    ['Marketplace|The strategy paper, the questions still open against it, and the working papers underneath.',
     'Library|The primary-source evidence base — every collection behind the strategy.',
     'Education|Autonomy and open-architecture education library.',
     'Leave|Chapter 5 leave planning — service history and balances.',
     'Intelligence|The entity/assertion knowledge graph, cut temporally or by gap.',
     'Records|Preserved activity, kept as a record.']
      .map(s=>{const[t,d]=s.split('|');return `<div class="tile"><div class="ico2">▤</div><h3>${t}</h3><p>${d}</p></div>`}).join('')
  }</div>`,
  form: () => `<div class="card"><div class="card-head"><div class="t">Default settings</div>
      <div class="d">Applied to every new record created through the API.</div></div>
    <div style="padding:20px"><div class="formgrid">${
      ['Role|Which permissions a new member starts with','Maximum budget|Cap in AUD, blank for none',
       'Budget period|daily, weekly or monthly','Region|Where records are stored',
       'Retention|How long soft-deleted rows survive','Notification address|Where alerts are sent']
        .map(s=>{const[l,h]=s.split('|');return `<div class="field"><label>${l}</label><div class="input">—</div><div class="hint">${h}</div></div>`}).join('')
    }</div></div></div>`,
  prose: () => `<div class="prose">
    <p>The shell answers three questions, and every surveyed product separates them onto different surfaces: where am I in the app, which view of it am I looking at, and what is globally available.</p>
    <h2>Why the measure matters here</h2>
    <p>Running text has an optimal measure of roughly sixty-six characters a line, and beyond about ninety the eye loses the return sweep — it becomes hard to find the start of the next line, and reading speed drops measurably. This is the one content shape where filling a 3360px viewport is actively worse than capping it, which is why a single global width answer cannot be right for both a ledger and a page of explanation.</p>
    <p>A table wants every pixel: columns truncate, and truncation costs a click to recover what was already on screen. A form does not want them, because a text input stretched to 1500px looks broken and reads worse than one at 340px. A card grid wants more columns rather than wider cards. Each of those is a different answer, and none of them is a number typed into a page.</p>
    <h2>What follows</h2>
    <p>Switch the content archetype above and watch the same measure setting succeed for one shape and fail for the next. That contradiction is the argument for tying the measure to the content, not to the app.</p>
  </div>`
};

const ROWS = [
  ['Broker A 1000001','cTrader','Trust','Active',321857.83,2014],
  ['Broker B 1000002','NA','Individual','Active',210088.98,156],
  ['Broker A 1000003','IRESS','Individual','Active',28332.48,759],
  ['Broker A 1000004','IRESS','Joint','Active',17903.76,783],
  ['Broker A 1000005','MT5','Trust','Dormant',4758.16,41],
  ['Broker A 1000006','IRESS','SMSF','Active',-4159.25,118],
  ['Broker B 1000007','NA','Joint','Closed',-66724.75,11],
  ['Broker C 1000008','TWS','Trust','Active',-255044.77,646],
  ['Broker B 1000009','NA','Individual','Active',-280964.98,206],
  ['Broker B 1000010','NA','SMSF','Dormant',-472465.78,69]
];

/* ── State ───────────────────────────────────────────────────────────────── */
const S = { app: 0, shape: 'b', content: 'dashboard' };
const $ = (id) => document.getElementById(id);
const B = document.body;
const chip = (c) => `<div class="chip"><span class="k">${c.k}</span><span>${c.v}</span><span class="caret">▾</span></div>`;
const tab  = (p) => `<div class="tab${p.active?' active':''}">${p.label}${p.count?`<span class="count">${p.count}</span>`:''}</div>`;

function renderApp() {
  const a = APPS[S.app];
  B.style.setProperty('--app-hue', a.hue ?? 250);
  $('brand-mark').textContent = a.mark ?? '◈';
  $('brand-name').textContent = a.name;
  $('avatar').textContent = a.initials ?? 'AB';
  $('who').textContent = a.who ?? 'A. Bee';
  $('search-txt-l').textContent = $('search-txt-t').textContent = a.searchLabel ?? 'Search…';

  $('rail-nav').innerHTML = a.nav.map((g) => {
    const head = g.group ? `<div class="nav-head">${g.group}</div>` : '';
    return head + g.items.map((i) => {
      const row = `<div class="nav-item${i.active?' active':''}">
          <span class="ico">${i.icon ?? '·'}</span><span class="lbl-text">${i.label}</span></div>`;
      const kids = (i.children && i.active)
        ? `<div id="rail-children">${i.children.map((c,n)=>
            `<div class="nav-item child"${n===1?' style="font-weight:600"':''}><span class="lbl-text">${c}</span></div>`).join('')}</div>`
        : '';
      return row + kids;
    }).join('');
  }).join('');

  $('crumb').innerHTML = a.crumb.map((c,i,arr) => i === arr.length-1
    ? `<span class="here">${c}</span>`
    : `<span class="up">${c}</span><span class="sep">›</span>`).join('');

  $('eyebrow').textContent = a.eyebrow ?? '';
  $('title').textContent = a.title;
  $('subtitle').textContent = a.subtitle ?? '';
  $('actions').innerHTML = (a.actions ?? [])
    .map(x => `<button class="btn${x.primary?' primary':''}">${x.label}</button>`).join('');

  const peers = a.peers ?? [], scope = a.scope ?? [];
  $('ctx-inner').innerHTML = peers.map(tab).join('') +
    `<div class="ctx-right">${scope.map(chip).join('')}</div>`;
  $('inpage-a-tabs').innerHTML = peers.map(tab).join('');
  $('inpage-a-scope').innerHTML = scope.map(chip).join('');
  $('inpage-c').innerHTML = peers.map(tab).join('') +
    `<div class="ctx-right">${scope.map(chip).join('')}</div>`;
}

function renderShape() {
  const now = S.shape === 'now', a = APPS[S.app], hasPeers = (a.peers ?? []).length > 0;
  $('search-lead').hidden = !now;
  $('bar-gap').hidden = !now;
  $('crumb').hidden = now;
  $('search-trail').hidden = now;
  $('ctxrow').hidden = !(S.shape === 'b' && hasPeers);
  $('inpage-a').hidden = !(S.shape === 'a' && hasPeers);
  $('inpage-c').hidden = !(S.shape === 'c' && hasPeers);
  // Peer views live in the rail everywhere except B, which lifts them out.
  const kids = $('rail-children');
  if (kids) kids.style.display = S.shape === 'b' ? 'none' : '';
  // The eyebrow survives only where nothing else states the section.
  $('eyebrow').hidden = !(now && a.eyebrow);
  $('note').innerHTML = NOTES[S.shape];
}

function renderContent() { $('content').innerHTML = CONTENT[S.content](); }

function measure() {
  const bar = document.querySelector('.bar');
  const m = document.querySelector('.measure');
  const sc = document.querySelector('.scroll');
  const right = document.querySelector('.bar-right');
  const left = S.shape === 'now' ? $('search-lead') : $('crumb');
  const lb = left.getBoundingClientRect(), rb = right.getBoundingClientRect();
  const gap = Math.max(0, Math.round(rb.left - lb.right));
  const barW = Math.round(bar.clientWidth);
  const region = Math.round(sc.clientWidth);
  const content = Math.round(m.getBoundingClientRect().width);
  const dead = region - content;
  const pct = Math.round(content / region * 100);
  const cls = (v, lo) => v >= lo ? 'good' : 'bad';
  $('readout').innerHTML =
    `<span>frame <b>${Math.round($('frame').clientWidth)}</b>px</span>` +
    `<span>bar gap <b>${gap}</b>px <span class="${gap > barW*.5 ? 'bad':'good'}">(${Math.round(gap/barW*100)}%)</span></span>` +
    `<span>content <b>${content}</b>/${region} <span class="${cls(pct,85)}">(${pct}%)</span></span>` +
    `<span>unused <b class="${dead > 200 ? 'bad':'good'}">${dead}</b>px</span>`;
}

const render = () => { renderApp(); renderShape(); renderContent(); measure(); };
const press = (sel, on) => document.querySelectorAll(sel)
  .forEach(b => b.setAttribute('aria-pressed', String(on(b))));

/* ── Wiring ──────────────────────────────────────────────────────────────── */
$('app-pick').innerHTML = APPS.map((a,i)=>`<option value="${i}">${a.name}</option>`).join('');
$('app-pick').addEventListener('change', (e) => { S.app = +e.target.value; render(); });
$('rail-toggle').addEventListener('click', () => {
  B.dataset.rail = B.dataset.rail === 'open' ? 'collapsed' : 'open'; measure();
});

document.querySelectorAll('#deck button').forEach((b) => b.addEventListener('click', () => {
  const d = b.dataset;
  if (d.shape)    { S.shape = d.shape; press('[data-shape]', x=>x.dataset.shape===S.shape); renderShape(); }
  else if (d.measure) { B.dataset.measure = d.measure; press('[data-measure]:not(body)', x=>x.dataset.measure===d.measure); }
  else if (d.content) { S.content = d.content; press('[data-content]', x=>x.dataset.content===S.content); renderContent(); }
  else if (d.identity){ B.dataset.identity = d.identity; press('[data-identity]:not(body)', x=>x.dataset.identity===d.identity); }
  else if (d.w !== undefined) {
    const st = $('stage');
    if (d.w) { st.dataset.w = d.w; $('frame').style.maxWidth = d.w + 'px'; }
    else { delete st.dataset.w; $('frame').style.maxWidth = ''; }
    press('[data-w]', x => x.dataset.w === d.w);
  }
  else if (d.t === 'dead')    { B.dataset.dead = B.dataset.dead === 'on' ? 'off' : 'on'; b.setAttribute('aria-pressed', B.dataset.dead === 'on'); }
  else if (d.t === 'texture') { B.dataset.texture = B.dataset.texture === 'on' ? 'off' : 'on'; b.setAttribute('aria-pressed', B.dataset.texture === 'on'); }
  else if (d.t === 'rail')    { B.dataset.rail = B.dataset.rail === 'open' ? 'collapsed' : 'open'; b.setAttribute('aria-pressed', B.dataset.rail === 'collapsed'); }
  else if (d.t === 'theme')   { const dk = B.classList.toggle('dark'); b.textContent = dk ? 'dark' : 'light'; b.setAttribute('aria-pressed', dk); }
  measure();
}));

addEventListener('resize', measure);
press('[data-shape]',   x => x.dataset.shape   === S.shape);
press('[data-measure]:not(body)',  x => x.dataset.measure  === B.dataset.measure);
press('[data-content]', x => x.dataset.content === S.content);
press('[data-identity]:not(body)', x => x.dataset.identity === B.dataset.identity);
press('[data-w]', x => x.dataset.w === '');
document.querySelector('[data-t="texture"]').setAttribute('aria-pressed','true');
document.querySelector('[data-t="theme"]').setAttribute('aria-pressed','true');
render();
</script>
</body>
</html>
