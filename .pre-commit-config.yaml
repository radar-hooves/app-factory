# Pre-commit hooks for the full-stack-app-template repo ITSELF.
#
# This guards the template's own source (copier.yaml, README.md, and
# everything under template/) — NOT the scaffolded apps it produces, which
# get their own guard via the shipped template/.pre-commit-config.yaml
# (rules-library/core/pre-commit-config.md). Without this file, commits to
# copier.yaml or the template's own docs carried no PII guard and no gitleaks.
#
# Install with: pre-commit install
# Run manually: pre-commit run --all-files
# Update hooks:  pre-commit autoupdate

default_language_version:
  python: python3.14

repos:
  # ---------------------------------------------------------------------------- #
  #                              Security scanning                               #
  # ---------------------------------------------------------------------------- #

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        name: 'security · Detect hardcoded secrets'

  # ---------------------------------------------------------------------------- #
  #                              File validation                                 #
  # ---------------------------------------------------------------------------- #

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        name: 'files · Fix end of files'
      - id: trailing-whitespace
        name: 'files · Trim trailing whitespace'
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
        name: 'yaml · Validate YAML syntax'
        args: [--unsafe]
      - id: check-toml
        name: 'toml · Validate TOML syntax'
      - id: check-json
        name: 'json · Validate JSON syntax'
      - id: check-merge-conflict
        name: 'git · Detect conflict markers'
      - id: check-added-large-files
        name: 'git · Block large file commits'
        args: ['--maxkb=5000']
      - id: check-case-conflict
        name: 'filesystem · Check case sensitivity'
      - id: detect-private-key
        name: 'security · Detect private keys'

  # ---------------------------------------------------------------------------- #
  #                              Household PII scan                              #
  # ---------------------------------------------------------------------------- #

  # The master check-pii hook, symlinked at .claude/hooks/master/precommit/pii.py
  # (rules-library/core/pre-commit-config.md — never a per-repo copy).
  - repo: local
    hooks:
      - id: check-pii
        name: 'security · Detect PII (names, mobiles, personal emails)'
        entry: household-precommit-pii
        language: system
        types: [text]

  # ---------------------------------------------------------------------------- #
  #                             Template parity manifest                         #
  # ---------------------------------------------------------------------------- #

  # template/.template-parity.json is DERIVED from the template's own files, so
  # it regenerates here rather than by a documented step someone has to remember
  # — a stale manifest silently passes every app that matches the OLD template.
  # Writes via a temp file so a generator failure cannot truncate the manifest.
  - repo: local
    hooks:
      - id: template-parity-manifest
        name: 'template · Regenerate the parity manifest'
        entry: >-
          bash -c 'out=$(mktemp) && python3 .claude/skills/canonical-app-migration/check-template-parity.py --generate . > "$out" && mv "$out" template/.template-parity.json'

        language: system
        pass_filenames: false
        files: '^template/'
