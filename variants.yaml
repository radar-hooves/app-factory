# Ratified permanent differences from the factory: one entry per app and key,
# added only by the operator's own act. <app> is the copier project_name; <key> a
# parity path (with {package}) or a shape key. The value says what fails if the app
# takes the factory's copy, and when the entry retires. Both gates read this file;
# converge-to-template.py copies an app's entries into its own parity manifest.

portcullis:
  backend/src/{package}/mcp/http_auth.py: "the broker mints and verifies its own hardware-attested bearers; an Authentik userinfo gate would put an external IdP in front of the estate's machine-auth authority; retires if the factory grows an attested-identity path"
  backend/src/{package}/mcp/auth.py: "the actor is the attested identity, not an x-client-id header an Authentik gate wrote; retires with http_auth.py"
  backend/src/{package}/mcp/actors.py: "identities are enrolled and revoked in the broker's store, not a static actors.yaml; retires with http_auth.py"
  backend/src/{package}/config/sections/mcp.py: "configures the Authentik gate this app does not install; retires with http_auth.py"
  deps:pyyaml: "declared only for actors.yaml, which this app has no use for; retires with http_auth.py"
  deps:types-pyyaml: "stubs for the above; retires with it"
  backend/src/{package}/config/sections/identity.py: "one broker holds one household's one vault: no users or workspaces to resolve a per-account grade for, and the operator's header names live on its console-editable auth config; retires if the broker ever holds a second tenant"
  backend/src/{package}/entitlements.py: "module entitlement is licensing for a multi-module tenant app; the broker has one module and gates on attested identity or the one operator session; retires with identity.py"
  frontend/src/lib/auth.svelte.ts: "the factory store resolves /users/me and /workspaces/me, neither of which the broker has; retires with identity.py"
  backend/src/{package}/api/admin/schemas.py: "the broker takes none of the factory's identity-bound slices (users, workspaces, agent, alerts, feedback, settings): it has one operator, no tenancy, and no cut to the vault is ruled until its holistic review; ratified by master under the operator's 04/11 ruling that engineering calls are master's; for veto at the next sitting"
  backend/src/{package}/api/admin/service.py: "the broker takes none of the factory's identity-bound slices (users, workspaces, agent, alerts, feedback, settings): it has one operator, no tenancy, and no cut to the vault is ruled until its holistic review; ratified by master under the operator's 04/11 ruling that engineering calls are master's; for veto at the next sitting"
  backend/src/{package}/elements.py: "the broker takes none of the factory's identity-bound slices (users, workspaces, agent, alerts, feedback, settings): it has one operator, no tenancy, and no cut to the vault is ruled until its holistic review; ratified by master under the operator's 04/11 ruling that engineering calls are master's; for veto at the next sitting"
  backend/src/{package}/scripts/__init__.py: "the broker takes none of the factory's identity-bound slices (users, workspaces, agent, alerts, feedback, settings): it has one operator, no tenancy, and no cut to the vault is ruled until its holistic review; ratified by master under the operator's 04/11 ruling that engineering calls are master's; for veto at the next sitting"
  backend/src/{package}/security_events.py: "the broker takes none of the factory's identity-bound slices (users, workspaces, agent, alerts, feedback, settings): it has one operator, no tenancy, and no cut to the vault is ruled until its holistic review; ratified by master under the operator's 04/11 ruling that engineering calls are master's; for veto at the next sitting"
  backend/tests/support/live_server.py: "the broker takes none of the factory's identity-bound slices (users, workspaces, agent, alerts, feedback, settings): it has one operator, no tenancy, and no cut to the vault is ruled until its holistic review; ratified by master under the operator's 04/11 ruling that engineering calls are master's; for veto at the next sitting"
  backend/tests/support/machine_token.py: "tenancy, identity and token exchange belong to users and workspaces, which the broker does not have; ratified by master under the operator's 04/11 ruling that engineering calls are master's; for veto at the next sitting"
  backend/tests/test_db_session_commit_ordering.py: "the broker takes none of the factory's identity-bound slices (users, workspaces, agent, alerts, feedback, settings): it has one operator, no tenancy, and no cut to the vault is ruled until its holistic review; ratified by master under the operator's 04/11 ruling that engineering calls are master's; for veto at the next sitting"
  deps:library: "declared for a factory slice the broker does not take (agent, files, exchange); ratified by master under the operator's 04/11 ruling that engineering calls are master's; for veto at the next sitting"
  deps:pyjwt: "declared for a factory slice the broker does not take (agent, files, exchange); ratified by master under the operator's 04/11 ruling that engineering calls are master's; for veto at the next sitting"
  backend/src/{package}/api/admin/router.py: "the broker's own admin plane (identities, providers, catalogue, audit), not the factory's admin slice; ratified by master under the operator's 04/11 ruling that engineering calls are master's; for veto at the next sitting"
  backend/src/{package}/config/sections/database.py: "pool defaults 30+30, not 5+10: a 90-way vend burst queued behind 15 connections (mcp-servers#927) and the deployed stack in yggdrasil sets no pool variable; ratified by master under the operator's 04/11 ruling that engineering calls are master's; for veto at the next sitting"
  backend/src/{package}/config/sections/security.py: "argon2_max_concurrent: Argon2id verifies at this cost thrash unbounded (90 at once ran ~10x solo, mcp-servers#927); a vault-specific setting in a factory section; ratified by master under the operator's 04/11 ruling that engineering calls are master's; for veto at the next sitting"
  backend/src/{package}/logging.py: "the broker's redaction configuration (low-entropy secret keys, vault field names) wraps the one telemetry call; ratified by master under the operator's 04/11 ruling that engineering calls are master's; for veto at the next sitting"
  backend/src/{package}/main.py: "the factory's lifespan supervises agent jobs, the token exchange and elements, which the broker does not take; keeping the broker's own lifespan; ratified by master under the operator's 04/11 ruling that engineering calls are master's; for veto at the next sitting"
  compose.yaml: "healthcheck probes /status, not /openapi.json: a static schema answered 200 for 42 hours with the engine dead (15/09/2026); an included fragment cannot override the main file; ratified by master under the operator's 04/11 ruling that engineering calls are master's; for veto at the next sitting"
  frontend/pnpm-workspace.yaml: "security overrides above the factory's floors (fast-uri 4.x, joi, valibot, ts-deepmerge, undici, happy-dom, source-map-js, brace-expansion) from the 01/11 and 02/11 reviews (#426); ratified by master under the operator's 04/11 ruling that engineering calls are master's; for veto at the next sitting"
  frontend/src/lib/shell.ts: "this app's shell data (nav, brand, store context): the extension point of app-frame.svelte, not yet on the sanctioned list; ratified by master under the operator's 04/11 ruling that engineering calls are master's; for veto at the next sitting"
  frontend/tests/e2e/shell.spec.ts: "the factory's shell spec visits /chat and /settings/members, routes the broker does not serve; this one drives the broker's own routes; ratified by master under the operator's 04/11 ruling that engineering calls are master's; for veto at the next sitting"
  .github/actionlint.yaml: "release.yaml runs on the atlas label, which the factory's label list lacks; ratified by master under the operator's 04/11 ruling that engineering calls are master's; for veto at the next sitting"
  root-inventory:cli: "the portcullis consumer client (Go, dependency-free), folded in from the retired signet repo by operator ruling; this app's own domain; ratified by master under the operator's 04/11 ruling that engineering calls are master's; for veto at the next sitting"
  ui-adoption: "page-header is the shape gate's adoption test but the ui-drift gate now refuses it as a hand-rolled page title (PageLead is the shell's); the two gates disagree, a factory fault; ratified by master under the operator's 04/11 ruling that engineering calls are master's; for veto at the next sitting"
pebblestone:
  backend/src/{package}/db/scoping.py: "one company, one tenant: the fail-closed workspace hooks over 373 files of single-tenant queries protect no second tenant and are the disclosure risk pebblestone#760 names; retires if the app ever serves a second company"
  backend/tests/test_workspace_scoping.py: "asserts the scoping hooks above; retires with them"
