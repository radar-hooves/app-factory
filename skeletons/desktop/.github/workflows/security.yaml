name: Security

# Trivy auto-detects whichever lockfile the repo commits, so there is nothing
# per-repo to tune.
#
# Do NOT convert this to the estate thin caller of master-project's
# security-checks.yaml: a public repo cannot reach a reusable workflow in a
# private one, and the attempt dies at startup validation with zero jobs.
# The repo's own code runs on atlas (rules-library/fleet/ci.md); a fork's pull
# request runs on a GitHub-hosted runner, so fork code never reaches it.

# Weekly, and on a dependency change: CVEs arrive with time, not with commits,
# and pre-commit already runs gitleaks on every commit. Measured 06/09/2026:
# on every push this was 3-5 runner jobs per commit across 22 repos, a third
# of the fleet's runs.
on:
  schedule:
    - cron: '0 18 * * 0' # Monday 04:00 AEST
  pull_request:
    paths:
      - '**/pyproject.toml'
      - '**/uv.lock'
      - '**/package.json'
      - '**/pnpm-lock.yaml'
      - '**/Cargo.lock'
      - '**/go.sum'
      - '**/Dockerfile*'
      - '.github/workflows/security.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","atlas"]') }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, unlike the estate reusable's commit-range scan.
          # Verified false positives are pinned in .gitleaksignore, never
          # waived by narrowing this.
          fetch-depth: 0

      - name: Scan for secrets (gitleaks CLI)
        # atlas carries gitleaks itself: the release binary is dynamically linked
        # and cannot run on NixOS. A hosted runner downloads it.
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          if ! command -v gitleaks > /dev/null; then
            tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
            url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
            curl -fsSL "$url" -o "$tarball"
            echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
            tar -xzf "$tarball" gitleaks
            PATH="$PWD:$PATH"
          fi
          # --redact is not optional: a finding would otherwise print the secret
          # into a PUBLIC run log.
          gitleaks detect --source . --redact --no-banner --verbose

  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","atlas"]') }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          # atlas keeps the vulnerability DB on its own disk; saving it to
          # GitHub's cache from there stalls past the timeout.
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dir: ${{ runner.environment == 'github-hosted' && format('{0}/.cache/trivy', github.workspace) || format('{0}/trivy', runner.tool_cache) }}
