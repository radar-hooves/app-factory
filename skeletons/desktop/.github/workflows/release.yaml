# Tag-triggered, for the installers this app ships. The gate is the first job:
# the `change` run on the tagged commit must have passed. The app adds its
# build and publish jobs below, each `needs: gate`; a dispatch builds from any
# ref and skips the gate. A tag is cut on the operator's word for a batch.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    if: startsWith(github.ref, 'refs/tags/v')
    name: change passed on the tagged commit
    runs-on: [self-hosted, household]
    permissions:
      actions: read
    steps:
      - name: Require a green change run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for _ in $(seq 1 120); do
            c=$(gh run list --repo "${{ github.repository }}" --workflow change.yaml --branch main \
              --commit "${{ github.sha }}" --json status,conclusion \
              --jq '[.[] | select(.status == "completed")][0].conclusion // ""')
            [ -n "$c" ] && break
            sleep 30
          done
          [ "$c" = success ] || { echo "change run on ${{ github.sha }} is '${c:-missing}', not success"; exit 1; }
