  - "{% if 'agent' in omitted_slices %}backend/tests/support/fake_clamd.py{% endif %}"
  - "{% if 'agent' in omitted_slices %}backend/tests/support/fake_library.py{% endif %}"
  - "{% if 'agent' in omitted_slices %}frontend/src/lib/agent{% endif %}"
  - "{% if 'agent' in omitted_slices %}frontend/src/routes/(protected)/chat{% endif %}"
  - "{% if 'agent' in omitted_slices %}frontend/src/test/chat{% endif %}"
  - "{% if 'agent' in omitted_slices %}frontend/tests/e2e/chat.spec.ts{% endif %}"
  - "{% if 'agent' in omitted_slices %}frontend/tests/e2e/chat{% endif %}"
