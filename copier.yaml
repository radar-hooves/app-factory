  - "{% if 'feedback' in omitted_slices %}backend/src/{{ package_name }}/config/sections/feedback.py{% endif %}"
  - "{% if 'feedback' in omitted_slices %}backend/src/{{ package_name }}/mcp/dispatchers/feedback.py{% endif %}"
