  - "{% if headless %}backend/tests/test_elements.py{% endif %}"
  - "{% if headless %}backend/tests/test_version.py{% endif %}"
  # A slice the app declares in `omitted_slices` that nothing it keeps composes on:
  # its own files leave the render, and the composition files render without it.
  - "{% if 'agent' in omitted_slices %}backend/src/{{ package_name }}/api/agent{% endif %}"
  - "{% if 'agent' in omitted_slices %}backend/src/{{ package_name }}/config/sections/agent.py{% endif %}"
  - "{% if 'agent' in omitted_slices %}backend/tests/test_agent_*.py{% endif %}"
  - "{% if 'agent' in omitted_slices %}backend/tests/support/attachments.py{% endif %}"
