# Files the template has retired and copier cannot delete. A plain update
# removes a file the old tagged render had and the new one lacks, but not
# (a) one `_exclude` newly hides: the old render shipped it, the new render is
# not asked to, and the app's copy is left standing (measured 12/10/2026,
# a scratch app updated from v2026.9.45: all 24 stayed, the opposite of what
# 2026.9.46 claimed); nor (b) a file that was only ever in an untagged commit,
# which neither render knows (e2e-ci.yaml, taken by hand from d61d3565).
# Keyed on the release that retires them, run once after the update, `rm -f`
# so an app already clean is untouched. A new retirement adds its path here at
# its own release; tests/migrations holds this list to `_exclude`. Needs
# `--trust`, which master's /master:update-app-template passes.
_migrations:
  - version: v2026.10.24
    when: "{{ _stage == 'after' and skeleton == 'web' }}"
    command:
      - rm
      - -rf
      - --
      - .github/image-inputs.sh
      - .github/workflows/e2e-ci.yaml
      - .github/workflows/canonical-shape.yaml
      - .github/workflows/deploy.yaml
      - .github/workflows/frontend-ci.yaml
      - .github/workflows/python-ci.yaml
      - .github/workflows/security.yaml
      - backend/tests/test_admin_api.py
      - backend/tests/test_agent_api.py
      - backend/tests/test_agent_content.py
      - backend/tests/test_agent_jobs_api.py
      - backend/tests/test_agent_settings.py
      - backend/tests/test_app_posture.py
      - backend/tests/test_database_settings.py
      - backend/tests/test_db_roles.py
      - backend/tests/test_db_guard.py
      - backend/tests/test_explicit_test_server_guard.py
      - backend/tests/test_exchange.py
      - backend/tests/test_fanout.py
      - backend/tests/test_gateway_models_check.py
      - backend/tests/test_gunicorn_bind.py
      - backend/tests/test_feedback_api.py
      - backend/tests/test_files_settings.py
      - backend/tests/test_logging.py
      - backend/tests/test_mcp_auth.py
      - backend/tests/test_mcp_stateless.py
      - backend/tests/test_rate_limit.py
      - backend/tests/test_security_events.py
      - backend/tests/test_settings_api.py
      - backend/tests/test_storage.py
      - backend/tests/test_system_health.py
      - backend/tests/test_vend.py
      - backend/tests/test_workspace_race.py
      - backend/tests/test_version.py
      - frontend/src/dev-identity.test.ts
      - frontend/src/hooks.client.test.ts
      - frontend/src/lib/api/client.test.ts
      - frontend/src/lib/api/error.test.ts
      - frontend/src/lib/api/error-toast.test.ts
      - frontend/src/lib/auth.svelte.test.ts
      - frontend/src/test/rooms
      - frontend/tests/e2e/rooms.spec.ts
      - frontend/tests/e2e/rooms
      - frontend/src/test/chat
      - frontend/src/test/art
      - frontend/tests/e2e/chat.spec.ts
      - frontend/tests/e2e/chat
      - frontend/src/routes/(protected)/layout.test.ts
      - frontend/src/lib/settings/sections.test.ts
      - frontend/src/params.test.ts
      - backend/tests/test_elements.py
      - backend/tests/test_security_headers.py
      - frontend/src/lib/elements/index.test.ts
      - frontend/src/test/superforms-field.test.ts
      - frontend/src/test/superforms-field.svelte
      - frontend/src/elements/selftest-card.svelte
      - frontend/src/routes/(protected)/settings/page.test.ts
  # A deleted scaffold slice is re-stamped file by file as the template adds to
  # it (settings.py, 2026.10.x). The slice is gone when its router is.
  - version: v2026.10.24
    when: "{{ _stage == 'after' and skeleton == 'web' }}"
    command:
      - sh
      - -c
      - >-
        d=backend/src/{{ package_name }}/api/example;
        [ -e $d/router.py ] || rm -f $d/dependencies.py $d/models.py $d/schemas.py $d/service.py $d/settings.py;
        rmdir $d 2>/dev/null || true
  # Stamped apps kept the retired "room" vocabulary: the extension-point header of
  # frontend/src/lib/agent/app.ts (app-owned, so an update never rewrites it) and
  # the parity manifest's entries for the deleted rooms files. Only a header that
  # still names RoomExtensions is replaced, so an app's own comment stands.
  - version: v2026.11.2
    when: "{{ _stage == 'after' and skeleton == 'web' }}"
    command:
      - python3
      - -c
      - |
        import json, os, re
        p = "frontend/src/lib/agent/app.ts"
        if os.path.exists(p):
            s = open(p).read()
            m = re.match(r"/\*\*.*?\*/\n", s, re.S)
            if m and "RoomExtensions" in m.group(0):
                open(p, "w").write(json.loads('"/**\\n * THIS app\'s chat pages: the extension point for `routes/(protected)/chat/[persona]`,\\n * which the factory owns (`app-factory docs/design/agent-console.md` \\u00a7Stamped:\\n * `api/agent/`). App-owned: copier never overwrites it.\\n *\\n * Export any of `ChatExtensions`\' members (`#lib/agent/chat.js`) by name:\\n * `oncite` (what a citation opens), `describeTool` (how a tool call in an\\n * answer reads), `copy` (the words, per persona), `Home` (a component on a new\\n * conversation, inside its scroll), `Turn` (a component presenting a question\\n * and its answer in place of the package\'s own) and `briefing` (what a Home page\'s\\n * briefing control asks, and the card it reads as) and `scope` (what the\\n * chat page says a persona answers from, or nothing) and\\n * `formatCost` (an answer\'s cost in this app\'s own currency and words, from\\n * US dollars, \\"about A$0.34\\") and `visuals` (a renderer for a\\n * fence\'s language beside the package\'s own, `{ openui: { component, parse } }`)\\n * and `Thinking` (a component drawn in place of the \\"working\\" line before an\\n * answer shows anything). The factory\'s copy\\n * exports none, and the page is the package\'s own.\\n */\\n"') + s[m.end():])
        p = ".template-parity.json"
        if os.path.exists(p):
            d = json.load(open(p))
            f = d.get("files", {})
            for k in [k for k in f if re.search(r"(^|/)rooms?(\.|/|$)|/rooms/|\[room\]", k)]:
                del f[k]
            open(p, "w").write(json.dumps(d, indent=2) + "\n")

# Which skeleton this app is stamped from, asked first because `_subdirectory`
# and every question below read it. `web` is the FastAPI + SvelteKit container
# app in template/; `desktop` the Tauri + SvelteKit app in skeletons/desktop/.
skeleton:
  type: str
  default: web
  choices:
    - web
    - desktop
  help: 'Which skeleton: web (FastAPI + SvelteKit container) or desktop (Tauri + SvelteKit)'

# A web app with no front end: the backend, its API and its /mcp, and nothing a
# browser loads. Asked second because every frontend question below reads it.
headless:
  type: bool
  default: false
  when: "{{ skeleton == 'web' }}"
  help: >-
    Does this app have no front end? `true` stamps the backend, its API and its /mcp alone: no frontend/, no SPA mount, no elements, no frontend build stage and no frontend hooks, and the change pipeline, finding no frontend member, runs no frontend CI. One answer and one render, never a variant: every headless app owes the same files. Turning it on in an app is `copier update --data headless=true`, then deleting frontend/ in the same commit: copier never deletes a file `_exclude` newly hides.

project_name:
  type: str
  help: 'Project name (kebab-case, e.g. my-app)'

# Derived, never asked: nine apps produced nine distinct values and not one
# overrode the default. `when: false` keeps it available to every template that
# references it while removing the prompt.
package_name:
  type: str
  when: false
  default: "{{ project_name | replace('-', '_') }}"

# The display name for the browser tab and the shell brand. The default is
# derived from project_name. It is asked because copier keeps only an asked
# answer across `copier update`; set project_title (in .copier-answers.yml, or
# `--data` at the first stamp) for an acronym, e.g. `CASPO`.
project_title:
  type: str
  default: "{{ project_name | replace('-', ' ') | title }}"
  help: Display name, for the browser tab and the shell brand. Change it only for an acronym or a spelling the slug cannot give.

github_repo:
  type: str
  when: "{{ skeleton == 'web' }}"
  default: "radar-hooves/{{ project_name }}"
  help: >-
    The GitHub repository (owner/name) this app files its feedback reports to as issues. The default is the household org and the project name; set it where the app's repository is named otherwise. A running app overrides it per host with `<APP>_GITHUB_REPO`; an empty override turns filing off, and the app says so at start and in /api/system/health.

team_name:
  type: str
  default: "{{ project_title }}"
  when: "{{ not headless }}"
  help: Who the feedback dialog says will read a report, as "the <name> team". Set it where the app's own team is not its display name (for example "CASPO").

# Hidden and never answered by an app — `when: false` keeps a real stamp's
# rendered value at the default `false` forever, since copier persists only
# an ASKED question's answer (package_name above is the same shape and the same
# proof: it does not appear in a real app's own .copier-answers.yml). The one
# caller that ever needs `true` is the factory's own CI, which passes it
# explicitly (`--data factory_selftest=true`)
# to render a scratch app carrying the factory's own tests of its own code
# (master-project#839 NEED 1) and runs its suite there. Gates the _exclude
# block above; nothing else in this file reads it.
factory_selftest:
  type: bool
  when: false
  default: false

dark_first:
  type: bool
  default: false
  when: "{{ not headless }}"
  help: >-
    Does this app rest DARK? Palette-class, like frontend/src/app.css — the one axis apps are allowed to differ on. `true` stamps a pre-hydration seed in app.html that sets mode-watcher's own storage key and class before first paint, and only when the visitor has stored no preference of their own. mode-watcher's `defaultMode` cannot express it: its setInitialMode script is injected at render time, which is late enough to flash light on a cold SPA shell, so an app that answered it by hand ended up excepting the whole file.

factory_fonts:
  type: str
  multiselect: true
  default: [display, body, code]
  choices:
    Fraunces (--ds-font-display): display
    Hanken Grotesk (--ds-font-body): body
    JetBrains Mono (--ds-font-code): code
  when: "{{ skeleton == 'web' and not headless }}"
  help: >-
    Which of the factory's self-hosted faces this app loads. Palette-class, like app.css: an app that brings its own face for a role (its own @font-face behind --ds-font-display, say) drops that one, and neither its package nor its import ships. Leave all three for an app that uses the factory's faces.

density:
  type: str
  default: comfortable
  choices:
    - comfortable
    - compact
  when: "{{ not headless }}"
  help: >-
    Row and control density for the shared design system, as `data-ds-density` on <html>. Palette-class, and the same one axis: `compact` is for an app whose primary surface is a dense table someone reads all day (portal-tables.md), `comfortable` for everything else. One app hand-edited app.html for this; every other app answers the default and its app.html does not change.

description:
  type: str
  help: 'One-sentence description of the project'

model_module:
  type: str
  default: llm
  when: "{{ skeleton == 'web' }}"
  help: >-
    The one module, dotted under the app's package, that calls models (`llm`, `core.litellm_client`). Everywhere else the app names a model only by a household gateway alias; backend/tests/test_gateway_models.py holds the line.

backend_port:
  type: int
  when: "{{ skeleton == 'web' }}"
  help: 'Backend API dev port — allocate from the port registry (band 8300-8399); never a framework default'

frontend_port:
  type: int
  when: "{{ not headless }}"
  help: 'Frontend Vite dev port — allocate from the port registry (web: band 5170-5199; desktop: the tauri band, with the next port its HMR socket); never a framework default'

bundle_identifier:
  type: str
  when: "{{ skeleton == 'desktop' }}"
  help: >-
    The desktop app's reverse-DNS bundle identifier (e.g. `com.example.app`), which names its data directories and its macOS bundle. Asked, never derived: changing it later moves every user's data out from under the app.

linux_cargo_args:
  type: str
  default: ''
  when: "{{ skeleton == 'desktop' }}"
  help: >-
    Extra cargo arguments for the desktop app's Linux CI build and tests (e.g. `--no-default-features --features vulkan`), for an app whose default features only build on macOS. Empty for most apps.

frontend_e2e_port:
  type: int
  when: "{{ skeleton == 'web' and not headless }}"
  help: >-
    Playwright's own Vite dev port — allocate from the port registry (band 5200-5229). Asked rather than derived: the E2E server used to be frontend_port + 1000, which lands outside every band the registry defines, so nothing could tell you it was free and no row recorded it.


postgres_host:
  type: str
  when: "{{ skeleton == 'web' }}"
  help: >-
    Tailnet address of the fleet host running this app's Postgres. There is no development database (stacks/dev-environment.md) — dev points at the real one, and the tailnet makes one address correct on any network. Required: left optional, three of nine apps answered blank and their dev path fell through to a code default pointing at localhost, which is nowhere.


portcullis_url:
  type: str
  when: "{{ skeleton == 'web' }}"
  help: >-
    Base URL of your secrets broker. The ONE machine-local fact that cannot itself be vended, which is why it is answered rather than fetched: development holds no env file, and the backend's config/vend.py resolves the database password through it. PORTCULLIS_URL still overrides at runtime. No factory default — a fleet stamping its own apps supplies it from its own declaration (`--data-file`) rather than typing it per app; postgres_host below took the same lesson the hard way.


private_index_name:
  type: str
  when: "{{ skeleton == 'web' }}"
  help: >-
    Alias for your private Python package index, used as `[[tool.uv.index]] name = ...` and in `[tool.uv.sources]` below (backend/pyproject.toml.jinja). No factory default: this app resolves sibling packages published outside PyPI (api-common, redactyl-core, nextcloud) from a private index only you can name.


private_index_url:
  type: str
  when: "{{ skeleton == 'web' }}"
  help: >-
    Base URL of that index's simple API (e.g. `https://your-index.example/your-user/prod/+simple/`). No factory default, for the same reason as private_index_name — a fleet supplies both from its own declaration rather than typing them per app: `--data-file` for a stamp, copier's settings-file `defaults:` for an update (docs/development/working-on-the-template.md).


registry_host:
  type: str
  when: "{{ skeleton == 'web' }}"
  help: >-
    Container registry the image is pushed to and Watchtower pulls from (e.g. `registry.example.com`). No factory default, for the same reason as private_index_name.


registry_credential_file:
  type: str
  when: "{{ skeleton == 'web' }}"
  help: >-
    Runner-host path to a `user:password` line that logs in to registry_host; the credential stays on the runner host, never a GitHub secret. No factory default.


watchtower_url:
  type: str
  when: "{{ skeleton == 'web' }}"
  help: >-
    Base URL of the deploying host's Watchtower HTTP API, asked to pull the image just pushed (e.g. `http://127.0.0.1:8080`). No factory default.


run_mode:
  type: str
  when: "{{ skeleton == 'web' }}"
  default: image
  choices:
    - image
    - source
  help: >-
    Where production runs this app's code from. `image` (default): the image the change pipeline pushes and Watchtower pulls. `source`: a checkout of `main` on the host, moved by the app's own deploy unit, with the image carrying only the system and toolchain. Both are canonical and neither is an exception; the answer is the app's record of which it is, read by the shape gate and fleet convergence in place of `registry-and-tag` and `health-revision` exceptions. Flipping it is this one line in `.copier-answers.yml`, and does not move the app: the host's stack and deploy unit do.


omitted_slices:
  type: yaml
  multiselect: true
  when: "{{ skeleton == 'web' }}"
  default: []
  choices:
    - users
    - workspaces
    - admin
    - feedback
    - agent
    - alerts
    - settings
    - system
    - files
  validator: >-
    {% for kept in ['alerts', 'files'] %}{% if kept in omitted_slices and 'agent' not in omitted_slices %}The agent slice raises alerts and writes files: omit agent with {{ kept }}, or keep {{ kept }}. {% endif %}{% endfor %}
  help: >-
    The factory slices this app does not take. Default none: every app takes the whole factory, and a slice the factory adds later reaches it. Declaring one is the app's record that its absence is canonical, never an exception or a variant. agent, feedback, alerts and files, which nothing kept composes on, leave the render: their files are not stamped, main.py, api/main.py, config, the model registry, the MCP server, the image and the frontend shell render without them, and the parity manifest is that render. users, workspaces, admin, settings and system are what the rest composes on, so they stay in the render; declaring one records that the app replaces it, and the gates count the files `slices.yaml` maps to it (at the app's own `_commit`) conforming, absent or differing. alerts and files go only with agent, which uses both. Taking a slice back or giving one up is `copier update --data` with the new list; a slice given up leaves its files standing (copier never deletes a file `_exclude` newly hides), and the app deletes them in the same commit.


runner_labels:
  type: str
  when: "{{ skeleton == 'web' }}"
  default: '["self-hosted", "household"]'
  help: >-
    JSON array of runner labels the app's CI and deploy jobs run on. The default is the household's runners, which the reusables also default to, so an app that answers nothing runs where it did.


postgres_user:
  type: str
  when: "{{ skeleton == 'web' }}"
  default: "{{ project_name | replace('-', '_') }}"
  help: >-
    Role this app's database was CREATED with: its bootstrap superuser, which the app logs in as once, at its first start, to hand the database to its owner role (`<app>_owner`; the app serves as `<app>_runtime`, docs/development/database-roles.md). Almost always the app's own name, but two of the fleet's databases were built with the superuser and answer to `postgres` — read it off the live server rather than assuming, because a wrong role fails as a password error and sends you hunting the wrong thing.


postgres_port:
  type: int
  when: "{{ skeleton == 'web' }}"
  default: 5432
  help: >-
    Postgres port for THIS app on the fleet host — one database per app, so it is per-app like backend_port. 5432 is the shared dev instance; an app that publishes its own database for workstation access takes a unique port from the Atlas Dev-DB band and answers with that.
