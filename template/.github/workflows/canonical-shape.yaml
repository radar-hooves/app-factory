name: Canonical Shape

# Structural gate for rules-library/platform/canonical-app-shape.md.
# A green run means the LAYOUT conforms, not that the repo is fully canonical.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  canonical-shape:
    uses: poodle64/master-project/.github/workflows/canonical-shape.yaml@main
