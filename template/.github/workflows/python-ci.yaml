name: Python CI

# Thin caller of the golden reusable (rules-library/core/ci-workflow-standard.md).
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      # backend/tests/test_version.py reads frontend/package.json, so a release
      # that bumps the frontend manifest alone gets no Python verdict at all and
      # the last one on main stays whatever it was — including a failure the
      # bump had just corrected. Measured on seshat 2026.8.20, where a tag was
      # one command away from being cut against a stale red signal.
      - 'frontend/package.json'
      - '.github/workflows/python-ci.yaml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/package.json'
      - '.github/workflows/python-ci.yaml'
  workflow_dispatch:
  # Called by the image build, which must not publish an image whose own tests
  # or types are red.
  workflow_call:

# Prefixed with this workflow's own name, not `github.workflow` alone: in a
# called workflow that expression is the CALLER's name, so two workflows called
# from one caller would share a group and cancel each other.
concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-ci:
    # No worker count is set here, deliberately. The reusable runs `pytest -q`
    # in ONE process and exposes no workers input, and a caller's `env:` does
    # not cross into a called workflow, so there is nothing here to set.
    #
    # An app that parallelises its suite — pytest-xdist, `-n auto` in addopts —
    # must cap it. `-n auto` reads the RUNNER's core count, and the household
    # runner is shared and 28-core, so one run asks for 28 pytest processes and
    # 28 of everything each one starts. `PYTEST_XDIST_AUTO_NUM_WORKERS` is the
    # cap, wherever the environment genuinely reaches the suite: the runner
    # itself, a developer's shell, a local workflow's `env:`. From THIS file the
    # only channel into the job is the reusable's own `pytest-args` input
    # (`-q -n 4`). The suite's Postgres is shared across workers
    # (backend/tests/conftest.py), so what a worker costs is CPU and memory —
    # not a database container each.
    uses: radar-hooves/master-project/.github/workflows/python-ci.yaml@main
    with:
      working-directory: backend
      lint-paths: 'src tests'
      mypy-paths: 'src'
      # Base + dev, and nothing else. A repo's non-dev groups carry editable
      # overrides onto sibling checkouts that exist only beside a developer's
      # clone; taking the defaults in CI resolves those to paths that are not
      # there. Dropping them resolves the same packages from the household index
      # instead, which is the one sanctioned mechanism.
      # `dev` is then asked for by name, or there is no pytest to run.
      sync-args: '--no-default-groups --group dev'
