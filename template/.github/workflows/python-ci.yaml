name: Python CI

# Thin caller of the golden reusable (rules-library/core/ci-workflow-standard.md).
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      # backend/tests/test_version.py reads frontend/package.json, so a release
      # that bumps the frontend manifest alone gets no Python verdict at all and
      # the last one on main stays whatever it was — including a failure the
      # bump had just corrected. Measured on seshat 2026.8.20, where a tag was
      # one command away from being cut against a stale red signal.
      - 'frontend/package.json'
      - '.github/workflows/python-ci.yaml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/package.json'
      - '.github/workflows/python-ci.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-ci:
    uses: poodle64/master-project/.github/workflows/python-ci.yaml@main
    with:
      working-directory: backend
      lint-paths: 'src tests'
      mypy-paths: 'src'
      # Base + dev, and nothing else. A repo's non-dev groups carry editable
      # overrides onto sibling checkouts that exist only beside a developer's
      # clone; taking the defaults in CI resolves those to paths that are not
      # there. Dropping them resolves the same packages from the household index
      # instead, which is the one sanctioned mechanism.
      # `dev` is then asked for by name, or there is no pytest to run.
      sync-args: '--no-default-groups --group dev'
