[project]
name = "agent-common"
# The floor a stamped app pins `>=` (template/backend/pyproject.toml.jinja). A
# published wheel carries the release tag it was built from instead
# (`.github/workflows/publish-kit-python.yaml`).
version = "2026.9.57"
description = "The household's Claude Code agent: the CLI driver, personas, transcripts, and the Agent interface"
requires-python = ">=3.14"
dependencies = [
    # library: the api-clients client of the library's caller door, which
    # `Collections` lists, searches and opens documents through. Resolved off
    # the private index (the workspace root's [tool.uv.sources]). The floor is
    # the first release carrying `CallerApi.query_as_caller`.
    "library>=2026.10.18124341",
    # httpx: `remote` forwards a relayed server's messages over it.
    "httpx>=0.28.1",
]

[project.optional-dependencies]
# Word and PDF from a persona's documents, and a Word attachment's text
# (`documents`): pandoc and typst, each a self-contained wheel, about 230 MB
# unpacked between them, so only an app that offers them installs them.
documents = ["pypandoc-binary>=1.17", "typst>=0.15.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_common"]

[tool.mypy]
python_version = "3.14"
strict = true
show_error_codes = true

[[tool.mypy.overrides]]
# pypandoc ships no types; `documents` calls one function of it.
module = ["pypandoc"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib --strict-markers"
testpaths = ["tests"]
