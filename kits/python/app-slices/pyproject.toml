[project]
name = "app-slices"
# The floor a stamped app pins `>=` (template/backend/pyproject.toml.jinja). A
# published wheel carries the release tag it was built from instead
# (`.github/workflows/publish-kit-python.yaml`).
version = "2026.10.0"
description = "The household web app's shared slices, mounted rather than stamped: runtime settings first"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.3",
    "sqlalchemy>=2.0.50",
    "pydantic>=2.13.4",
    # httpx: settings.gateway_models, a model_alias setting's `GET {base_url}/models`.
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_slices"]

[tool.mypy]
python_version = "3.14"
strict = true
show_error_codes = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib --strict-markers"
testpaths = ["tests"]
