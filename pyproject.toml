# This repo's Python kits, one uv workspace. Rooted here rather than at
# kits/python beside kits/rust's own Cargo workspace because the household's
# shared publish workflow (master-project `publish-wheels.yaml`) builds every
# package of the workspace at the checkout's root. Nothing here reaches a
# stamped app: copier renders template/ alone (`_subdirectory`), and an app
# takes a kit as a versioned dependency off the household index.
[tool.uv.workspace]
members = ["kits/python/*"]

[dependency-groups]
dev = [
    "ruff>=0.15.16",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    # respx: fakes the library client's HTTP at the transport, so a kit test
    # drives the real client over recorded bytes.
    "respx>=0.22.0",
    # api-common and redactyl-core reach the kits only through the `library`
    # client, but under the explicit index below a pin reaches only a DECLARED
    # dependency: a transitive-only private name resolves against PyPI and is
    # not found. Declared here, not in a kit's own metadata, which names what
    # the kit imports. Same floors as the stamped backend.
    "api-common>=2026.9.4",
    "redactyl-core>=2026.7.0",
]

# The household's private index (devpi), explicit: ONLY the packages pinned to
# it below resolve there, so a private name is never satisfied by a public
# package of the same name (core/supply-chain.md). By its LAN address on atlas,
# read anonymously, as publish-kit-python.yaml uploads to it: uv.lock records
# whatever URL resolved, so a URL supplied at run time (UV_INDEX) would still
# land in this public tree, and a household host name must not.
[[tool.uv.index]]
name = "godswood"
url = "http://172.21.0.2:3141/poodle64/prod/+simple/"
explicit = true

[tool.uv.sources]
library = { index = "godswood" }
api-common = { index = "godswood" }
redactyl-core = { index = "godswood" }
